<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Graph Quest — verify</title>
<link rel="stylesheet" href="./css/styles.css">
<style>
  body{padding:18px}
  .grp{border:1px solid var(--brd);border-radius:4px;padding:12px;margin-bottom:12px;background:var(--panel)}
  .ok{color:var(--good)} .no{color:var(--bad)}
  .line{font-family:var(--font-num);font-size:12.5px;padding:2px 0}
  h2{margin-bottom:8px}
  #sum{position:sticky;top:0;background:var(--bg);padding:10px 0;font-size:17px;font-family:var(--font-display);z-index:2}
</style>
</head>
<body>
<h1>Graph Quest — verify</h1>
<div id="sum">running…</div>
<div id="out"></div>

<script type="module">
import { QUESTS, buildRound, setSemicircles, getQuest } from "./js/quests/index.js";
import { secondChanceAllowed } from "./js/play.js";
import { questUnlocked, mapScreen, B_INTRO } from "./js/screens.js";
import { verifyFunction, renderFunction, computeFunction } from "./js/engine/function-graph.js";
import { axisGate, sweep } from "./js/engine/interactive.js";
import { L, UI, setLang } from "./js/i18n.js";
import { fmtComma } from "./js/check.js";
import {
  makeFn, criticalXs, sections, signAt, intersections, paraTP, paraRoots,
  makeFn as mf, intervalStr, mergeSections, joinIntervals,
  lengthBetween, avgGradient, gradientStr, eqStr, eqTPStr, EQ, hypXInt,
} from "./js/funclib.js";
import {
  specFor, randParabola, randHyperbola, randExp, randLine, randSemicircle,
  windowFor, features, asymOnAxis, randHyperbolaOffAxis, mostlyInFrame,
} from "./js/quests/_graphs.js";
import { answerString } from "./js/quests/_intervals.js";

const out = document.getElementById("out");
let pass = 0, fail = 0;
const group = (title) => {
  const g = document.createElement("div"); g.className = "grp";
  g.innerHTML = `<h2>${title}</h2>`; out.appendChild(g); return g;
};
function check(g, label, ok, extra = "") {
  if (ok) pass++; else fail++;
  const d = document.createElement("div");
  d.className = "line " + (ok ? "ok" : "no");
  d.textContent = `${ok ? "PASS" : "FAIL"} — ${label}${extra ? "  ·  " + extra : ""}`;
  g.appendChild(d);
  return ok;
}
function info(g, text) {
  const d = document.createElement("div");
  d.className = "line";
  d.textContent = text;
  g.appendChild(d);
}

const BAD = /NaN|undefined|Infinity|null/;
/* render like the app does: drop the tags, then decode the entities
   (&lt; is a real "<" to the learner, so the tests must see one too) */
const decoder = document.createElement("textarea");
function strip(h) {
  decoder.innerHTML = String(h).replace(/<[^>]*>/g, "");
  return decoder.value;
}

/* ---------- 1. the engine's own honesty checks ---------- */
{
  const g = group("1. Engine — every drawn feature really lies where the maths says");
  const builders = [
    ["line", () => randLine()], ["parabola", () => randParabola()],
    ["hyperbola", () => randHyperbola()], ["exp", () => randExp()],
    ["semicircle", () => randSemicircle()],
  ];
  builders.forEach(([name, make]) => {
    let bad = 0, worst = "";
    for (let i = 0; i < 120; i++) {
      const cv = make();
      const spec = specFor([cv], { ticks: "labels", labels: ["f"] });
      const res = verifyFunction(spec);
      const f = res.filter((r) => !r.ok);
      if (f.length) { bad++; worst = f[0].label; }
      const svg = renderFunction(spec);
      if (BAD.test(svg.replace(/class="[^"]*"/g, ""))) { bad++; worst = "NaN/undefined in the SVG"; }
    }
    check(g, `${name}: 120 random graphs are all to scale and clean`, bad === 0, bad ? `${bad} bad · ${worst}` : "");
  });
}

/* ---------- 2. maths library sanity ---------- */
{
  const g = group("2. Maths library — computed answers, not typed ones");
  let ok = true, why = "";
  for (let i = 0; i < 300; i++) {
    const cv = randParabola();
    const tp = paraTP(cv), f = makeFn(cv);
    /* the turning point is really the lowest/highest value nearby */
    const a = f(tp.x - 0.7), b = f(tp.x + 0.7), v = f(tp.x);
    const opens = a > v && b > v, closes = a < v && b < v;
    if (!opens && !closes) { ok = false; why = "turning point is not a turn"; break; }
    paraRoots(cv).forEach((r) => { if (Math.abs(f(r)) > 1e-6) { ok = false; why = "root is not a root"; } });
  }
  check(g, "parabola turning points and roots are genuine (300 curves)", ok, why);

  ok = true; why = "";
  for (let i = 0; i < 200; i++) {
    const A = randParabola(), Bc = randLine();
    const win = windowFor([A, Bc]);
    if (!win) continue;                    // a rare infeasible pair — not this check's concern
    const xs = intersections(A, Bc, win.xmin, win.xmax);
    const fa = makeFn(A), fb = makeFn(Bc);
    xs.forEach((x) => { if (Math.abs(fa(x) - fb(x)) > 1e-4) { ok = false; why = `f−g = ${fa(x) - fb(x)} at x=${x}`; } });
  }
  check(g, "every reported intersection really has f(x) = g(x) (200 pairs)", ok, why);

  ok = true; why = "";
  for (let i = 0; i < 200; i++) {
    const cv = randHyperbola();
    const win = windowFor([cv]);
    const cuts = criticalXs([cv], win.xmin, win.xmax);
    const secs = sections(cuts, win.xmin, win.xmax);
    /* the sign must be constant across a whole section */
    secs.forEach((s) => {
      const probes = [0.15, 0.5, 0.85].map((t) => s.x0 + t * (s.x1 - s.x0));
      const sgns = probes.map((x) => signAt(cv, x)).filter((v) => v !== null && v !== 0);
      if (new Set(sgns).size > 1) { ok = false; why = `sign flips inside a section (${s.x0}…${s.x1})`; }
    });
  }
  check(g, "the sign never changes inside a section — so the cut lines are complete", ok, why);
}

/* ---------- 3. every quest generator, in both languages ---------- */
for (const lang of ["af", "en"]) {
  setLang(lang);
  const g = group(`3. Quest generators — ${lang.toUpperCase()}`);
  for (const q of QUESTS) {
    let bad = 0, why = "";
    for (let rep = 0; rep < 12; rep++) {
      let items = [];
      try { items = buildRound(q.id); } catch (e) { bad++; why = "threw: " + e.message; break; }
      /* a buildAll quest (exam mode) hands back one whole sketch, so its
         length is however many sub-questions that sketch has */
      const wantLen = q.buildAll ? items.length >= 4 : items.length === q.rounds;
      if (!wantLen) { bad++; why = `built ${items.length} (rounds=${q.rounds})`; break; }
      /* one sketch per exam round — compared by CONTENT, since a question may
         legitimately hand out a variant (e.g. asymptote labels stripped).
         Only the exam kind promises this: the discovery quest also builds a
         whole round at once, but every beat there is its own picture. */
      const sketchKey = (s) => JSON.stringify([s.win, s.curves.map((c) => [c.kind, c.a, c.b, c.p, c.q, c.c, c.r])]);
      if (q.oneSketch && !items.every((it) => sketchKey(it.graph) === sketchKey(items[0].graph))) {
        bad++; why = "exam round mixes more than one sketch"; break;
      }
      for (const it of items) {
        const mcq = it.type === "interactive" ? it.then : it;
        if (it.type === "interactive" && !it.build) { bad++; why = "interactive without build()"; break; }
        if (!mcq) continue;
        const labels = mcq.options.map((o) => strip(L(o.label)));
        if (mcq.options.filter((o) => o.correct).length !== 1) { bad++; why = "not exactly one correct option"; break; }
        if (new Set(labels).size !== labels.length) { bad++; why = "duplicate options: " + labels.join(" | "); break; }
        if (labels.some((s) => BAD.test(s) || !s.trim())) { bad++; why = "bad option text: " + labels.join(" | "); break; }
        const ptext = strip(L(mcq.prompt || it.prompt || ""));
        if (BAD.test(ptext) || !ptext.trim()) { bad++; why = "bad prompt: " + ptext; break; }
        if (!strip(L(mcq.answerLabel || "")).trim()) { bad++; why = "empty answerLabel"; break; }
        if (mcq.graph) {
          const f = verifyFunction(mcq.graph).filter((r) => !r.ok);
          if (f.length) { bad++; why = "graph not honest: " + f[0].label; break; }
        }
      }
      if (bad) break;
    }
    check(g, `${q.id} — ${strip(L(q.title))}: 12 full rounds are well formed`, bad === 0, why);
  }
}

/* ---------- 4. the interactive mechanics really mount ---------- */
{
  setLang("af");
  const g = group("4. Interactive mechanics — they mount, draw, and gate the question");
  const host = document.createElement("div");
  host.style.width = "360px";
  document.body.appendChild(host);
  host.style.position = "absolute"; host.style.left = "-9999px";

  for (const q of QUESTS) {
    /* fix day (2026-08-13): a single buildRound() draw can legitimately
       miss a low-weight interactive skill (qT's slideMatch is weight 1 of
       8, in a 6-round draw) — skipping this whole check on that unlucky
       draw is exactly what flipped the harness's grand total between two
       different numbers from one run to the next (fail always stayed 0).
       Keep drawing rounds until an interactive item turns up, capped so a
       quest that truly has none (qB, q7's fixed exam sheets) still
       terminates and is skipped — the same way, every single run. */
    let items = [];
    for (let draw = 0; draw < 40 && !items.length; draw++) {
      items = buildRound(q.id).filter((it) => it.type === "interactive");
    }
    if (!items.length) continue;
    let bad = 0, why = "";
    for (const it of items) {
      const box = document.createElement("div");
      host.appendChild(box);
      let unlocked = false;
      try {
        it.build(box, () => { unlocked = true; }, () => {}, () => {}, () => {});
      } catch (e) { bad++; why = `${it.skillId} threw: ${e.message}`; continue; }
      const svg = box.querySelector("svg");
      if (!svg) { bad++; why = `${it.skillId} drew no svg`; continue; }
      if (!svg.querySelector("path.fg-curve")) { bad++; why = `${it.skillId} drew no curve`; continue; }
      if (unlocked) { bad++; why = `${it.skillId} unlocked before the learner did anything`; continue; }
      if (!it.then) { bad++; why = `${it.skillId} has no follow-up question`; continue; }
    }
    check(g, `${q.id}: every interactive round mounts and stays locked`, bad === 0, why);
  }
  host.remove();
}

/* ---------- 4a. the discovery sliders (session 2) ----------
   The mechanic's three promises, tested rather than trusted:
   it mounts, it stays locked until the WHOLE range has been dragged,
   and at every single stop the curve on screen is the curve funclib
   describes. Plus the no-spoilers rule (Law 7) and her wording rulings. */
{
  setLang("af");
  const g = group("4a. Discovery sliders — mount, lock, and match the maths");
  const host = document.createElement("div");
  host.style.position = "absolute"; host.style.left = "-9999px"; host.style.width = "360px";
  document.body.appendChild(host);

  const mountBeat = (it) => {
    const box = document.createElement("div");
    host.appendChild(box);
    const fired = { n: 0 };
    const ctl = it.build(box, () => { fired.n++; }, () => {}, () => {}, () => {});
    return { box, ctl, fired };
  };
  /* read the drawn path back OUT of the SVG, run every point through the
     inverse transform, and compare it with funclib's own value: the
     picture on screen checked against the maths, not against a second
     copy of the drawing code */
  const curveOffBy = (box, spec) => {
    const gm = computeFunction(spec), f = mf(spec.curves[0]);
    const paths = [...box.querySelectorAll("path.fg-curve")];
    if (!paths.length) return Infinity;
    let worst = 0;
    paths.forEach((p) => {
      const nums = (p.getAttribute("d").match(/-?\d+(?:\.\d+)?/g) || []).map(Number);
      for (let i = 0; i + 1 < nums.length; i += 2) {
        const y = f(gm.xAt(nums[i]));
        if (!Number.isFinite(y)) continue;
        worst = Math.max(worst, Math.abs(y - gm.yAt(nums[i + 1])));
      }
    });
    return worst;
  };

  /* the lesson always arrives whole, and always in the same order */
  const ORDER = ["aSign", "aSize", "pShift", "qShift", "cCut", "qVsC"];
  let bad = 0, why = "";
  for (let rep = 0; rep < 40; rep++) {
    let items = [];
    try { items = buildRound("q1"); } catch (e) { bad++; why = "threw: " + e.message; break; }
    if (items.length !== ORDER.length) { bad++; why = `built ${items.length} beats`; break; }
    if (!items.every((it, i) => it.skillId === ORDER[i])) { bad++; why = "beats came out of lesson order"; break; }
    if (!items.every((it) => it.type === "interactive" && it.build && it.then)) {
      bad++; why = "a beat is not a gated interactive round"; break;
    }
  }
  check(g, "all six discovery beats build, in lesson order (40 rounds)", bad === 0, why);

  /* mounts, and the question stays shut until the last stop */
  bad = 0; why = "";
  buildRound("q1").forEach((it) => {
    let m;
    try { m = mountBeat(it); } catch (e) { bad++; why = `${it.skillId} threw: ${e.message}`; return; }
    const { box, ctl, fired } = m;
    if (!box.querySelector("svg path.fg-curve")) { bad++; why = `${it.skillId} drew no curve`; return; }
    if (!ctl || !Array.isArray(ctl.sliders) || !ctl.sliders.length) { bad++; why = `${it.skillId} handed back no slider`; return; }
    if (fired.n) { bad++; why = `${it.skillId} unlocked on mount`; return; }
    /* the opening stop is interior, so the walk below really does leave
       one stop unseen (and a learner always has somewhere to drag) */
    ctl.sliders.forEach((s, si) => {
      if (s.index() === 0 || s.index() === s.values().length - 1) {
        bad++; why = `${it.skillId} slider ${si} opens on an end stop`;
      }
    });
    const stops = [];
    ctl.sliders.forEach((s, si) => s.values().forEach((_, k) => stops.push([si, k])));
    stops.slice(0, -1).forEach(([si, k]) => ctl.sliders[si].setIndex(k));
    if (fired.n) { bad++; why = `${it.skillId} unlocked before the whole range was dragged`; return; }
    const [ls, lk] = stops[stops.length - 1];
    ctl.sliders[ls].setIndex(lk);
    if (fired.n !== 1) { bad++; why = `${it.skillId} fired done ${fired.n}× on completing the range`; }
  });
  check(g, "every beat mounts, opens mid-range, and stays locked until the last stop", bad === 0, why);

  /* the picture at every stop: square grid, readable zoom, honest, and
     exactly the curve funclib computes */
  bad = 0; why = "";
  let stopsChecked = 0, worstOff = 0;
  buildRound("q1").forEach((it) => {
    const { ctl } = mountBeat(it);
    ctl.sliders.forEach((s) => {
      const winKey = JSON.stringify(s.specs()[0].win);
      if (!s.specs().every((sp) => JSON.stringify(sp.win) === winKey)) {
        bad++; why = `${it.skillId}: the window changes mid-drag`;
      }
      s.values().forEach((v, k) => {
        if (Math.abs(v * 2 - Math.round(v * 2)) > 1e-9) { bad++; why = `${it.skillId}: stop ${v} is neither a whole number nor a half`; }
        s.setIndex(k);
        const spec = s.spec(), gm = computeFunction(spec);
        stopsChecked++;
        if (Math.abs(gm.sx - gm.sy) > 1e-6) { bad++; why = `${it.skillId}: sx ${gm.sx.toFixed(2)} ≠ sy ${gm.sy.toFixed(2)}`; }
        if (gm.sx < 18 || gm.sx > 47) { bad++; why = `${it.skillId}: ${gm.sx.toFixed(1)} px/unit`; }
        const f = verifyFunction(spec).filter((r) => !r.ok);
        if (f.length) { bad++; why = `${it.skillId}: ${f[0].label}`; }
        const off = curveOffBy(s.graph(), spec);
        worstOff = Math.max(worstOff, off);
        if (!(off <= 0.01)) { bad++; why = `${it.skillId}: drawn curve is ${off.toFixed(3)} off funclib`; }
      });
    });
  });
  check(g, `the drawn curve matches funclib at every slider stop (${stopsChecked} stops)`, bad === 0, why);
  info(g, `worst gap between the drawn curve and funclib: ${worstOff.toExponential(1)} units`);

  /* Law 7 — the app never states the finding before the learner commits */
  bad = 0; why = "";
  for (let rep = 0; rep < 10; rep++) {
    buildRound("q1").forEach((it) => {
      const said = strip(L(it.prompt || "")) + " " + strip(L(it.stem || "")) + " " + strip(L(it.coach || ""));
      const answer = strip(L(it.then.answerLabel || ""));
      if (answer && said.includes(answer)) { bad++; why = `${it.skillId} states its own finding up front`; }
      if (!Array.isArray(it.then.solution) || !it.then.solution.length) { bad++; why = `${it.skillId} has no method card`; }
      if (it.then.options.length < 3 || it.then.options.length > 4) { bad++; why = `${it.skillId} offers ${it.then.options.length} options`; }
    });
  }
  check(g, "no beat reveals its finding before the commit, and every one ends in a method card", bad === 0, why);

  /* her standing wording rulings, across every quest: the Afrikaans verb
     is "drag", never "sleep"; a sentence is a "sin", never a "frase".
     Widened, fix day (2026-08-13): the scan used to see only built-round
     strings and the i18n UI object — a banned word sitting in a quest's
     title/blurb, an intro cutscene caption, or a screens.js learner-facing
     literal (mapScreen's B_INTRO) could ship unnoticed. Now walked too. */
  bad = 0; why = "";
  const strings = [];
  const collect = (v) => { if (v != null) strings.push(strip(L(v))); };
  for (const q of QUESTS) {
    collect(q.title); collect(q.blurb);
    if (q.intro) q.intro.beats.forEach((b) => collect(b.cap));
    for (let rep = 0; rep < 4; rep++) {
      buildRound(q.id).forEach((it) => {
        [it.prompt, it.stem, it.coach, it.unlockMsg].forEach(collect);
        (it.hints || []).forEach(collect);
        const mcq = it.then || it;
        collect(mcq.prompt); collect(mcq.answerLabel);
        (mcq.options || []).forEach((o) => { collect(o.label); collect(o.misc); });
        (mcq.solution || []).forEach(collect);
        (mcq.hints || []).forEach(collect);
        collect(mcq.hint);
      });
    }
  }
  Object.values(UI).forEach(collect);
  collect(B_INTRO);        // screens.js's mapScreen() intro sentence
  /* the rest of her wording pass (2026-08-12), added after batch 2 session 2
     wrote "sywaarts" into a transformations hint: "sywaarts" → "links of
     regs", "hoegenaamd" → "op of af", and a hyperbola's branches are
     vlerkies — "tak"/"takke" is banned outright. */
  const BANNED = [
    [/\bsleep\b/i, 'use "trek", not "sleep"'],
    [/\bfrase\b/i, 'use "sin", not "frase"'],
    [/\bsywaarts\b/i, 'use "links of regs", not "sywaarts"'],
    [/\bhoegenaamd\b/i, 'use "op of af", not "hoegenaamd"'],
    /* \btak(ke)?\b, not \btakke?\b — the old pattern parsed as "takk" +
       optional "e" and never matched the SINGULAR "tak" (session 3's
       negative test caught it, foreman fix 2026-08-13) */
    [/\btak(ke)?\b/i, 'a hyperbola has "vlerkies" — "tak/takke" is banned'],
    /* her playtest corrections, 2026-08-13 (Transformasies): reflections are
       the reflekteer-family, never spieël-anything or "omgeflip"; a solid
       curve is a "soliede lyn/grafiek", never "vol"; a round of play is a
       "rondte", never "ronde". */
    [/spie[eë]l/i, 'use "refleksie/gereflekteer(de)", never the spieël-family'],
    [/\bomgeflip\b/i, 'use "gereflekteer", not "omgeflip"'],
    [/\bvol (lyn|grafiek)\b/i, 'use "soliede lyn/grafiek", not "vol"'],
    [/\bronde\b/i, 'a round of play is a "rondte", not a "ronde"'],
  ];
  strings.forEach((s) => {
    BANNED.forEach(([re, msg]) => { if (re.test(s)) { bad++; why = `${msg} — "${s.slice(0, 60)}"`; } });
  });
  check(g, `her banned words stay out of every learner string, including quest title/blurb, intro captions and B_INTRO (${strings.length} checked)`, bad === 0, why);

  /* negative test, exactly as briefed: temporarily inject a banned word
     into a REAL quest's blurb, confirm the widened scan (which now walks
     q.title/q.blurb) actually catches it, then restore the quest and
     confirm the real collected strings report clean again */
  {
    const victim = QUESTS[0];
    const originalBlurb = victim.blurb;
    const scanQuestFor = (q) => {
      const probe = [];
      const pc = (v) => { if (v != null) probe.push(strip(L(v))); };
      pc(q.title); pc(q.blurb);
      let found = false;
      probe.forEach((s) => BANNED.forEach(([re]) => { if (re.test(s)) found = true; }));
      return found;
    };
    victim.blurb = "jy moet die punt sleep na die regte plek";   // injects the banned "sleep"
    const caught = scanQuestFor(victim);
    victim.blurb = originalBlurb;                                 // restore immediately, before anything else reads it
    check(g, "negative test: a banned word injected into a real quest's blurb IS caught by the widened scan", caught === true);
    check(g, "…and the quest's real blurb reports clean again once the injected word is removed (restored)", scanQuestFor(victim) === false);
  }

  host.remove();
}

/* ---------- 4a2. Discovery sliders — line, hyperbola, exp (session 3) ----------
   The same three promises as 4a, walked headlessly for quest q1b: it
   mounts, it stays locked until the WHOLE range has been dragged, and at
   every stop the curve on screen is the curve funclib describes. Adds one
   more promise specific to this session: a hyperbola beat's dashed
   asymptote CROSS (both the x= and y= lines) is present at every stop —
   never just one of the two, never neither. */
{
  setLang("af");
  const g = group("4a2. Discovery sliders — line/hyperbola/exp (session 3)");
  const host = document.createElement("div");
  host.style.position = "absolute"; host.style.left = "-9999px"; host.style.width = "360px";
  document.body.appendChild(host);

  const mountBeat = (it) => {
    const box = document.createElement("div");
    host.appendChild(box);
    const fired = { n: 0 };
    const ctl = it.build(box, () => { fired.n++; }, () => {}, () => {}, () => {});
    return { box, ctl, fired };
  };
  /* like 4a's curveOffBy, but with one extra allowance measured directly
     (a debug walk of the hypQ beat pinned it exactly): a point that got
     CLIPPED at the frame edge is placed by intersectY()'s precise
     boundary crossing, then that pixel gets rounded to 2dp for the SVG
     (N() in function-graph.js). Recovering x from the rounded pixel and
     re-evaluating f(x) there does not reproduce ymin/ymax exactly when
     the curve is steep right at the clip (a hyperbola's elbow bend) —
     that is a property of clip-then-round, not a drawing error, so a
     point sitting on the frame boundary is excluded from this check the
     same way the engine itself treats a clip differently from a sampled
     point. */
  const curveOffBy = (box, spec) => {
    const gm = computeFunction(spec), f = mf(spec.curves[0]);
    const { ymin, ymax } = spec.win;
    const onBoundary = (y) => Math.abs(y - ymin) < 1e-3 || Math.abs(y - ymax) < 1e-3;
    const paths = [...box.querySelectorAll("path.fg-curve")];
    if (!paths.length) return Infinity;
    let worst = 0;
    paths.forEach((p) => {
      const nums = (p.getAttribute("d").match(/-?\d+(?:\.\d+)?/g) || []).map(Number);
      for (let i = 0; i + 1 < nums.length; i += 2) {
        const x = gm.xAt(nums[i]);
        const drawnY = gm.yAt(nums[i + 1]);
        if (onBoundary(drawnY)) continue;
        const y = f(x);
        if (!Number.isFinite(y)) continue;
        worst = Math.max(worst, Math.abs(y - drawnY));
      }
    });
    return worst;
  };

  const ORDER = ["lineSign", "lineSize", "lineC", "hypSign", "hypP", "hypQ", "expSide", "expB", "expQ"];
  let bad = 0, why = "";
  for (let rep = 0; rep < 40; rep++) {
    let items = [];
    try { items = buildRound("q1b"); } catch (e) { bad++; why = "threw: " + e.message; break; }
    if (items.length !== ORDER.length) { bad++; why = `built ${items.length} beats`; break; }
    if (!items.every((it, i) => it.skillId === ORDER[i])) { bad++; why = "beats came out of lesson order"; break; }
    if (!items.every((it) => it.type === "interactive" && it.build && it.then)) {
      bad++; why = "a beat is not a gated interactive round"; break;
    }
  }
  check(g, "all nine beats build, in lesson order (40 rounds)", bad === 0, why);

  bad = 0; why = "";
  buildRound("q1b").forEach((it) => {
    let m;
    try { m = mountBeat(it); } catch (e) { bad++; why = `${it.skillId} threw: ${e.message}`; return; }
    const { box, ctl, fired } = m;
    if (!box.querySelector("svg path.fg-curve")) { bad++; why = `${it.skillId} drew no curve`; return; }
    if (!ctl || !Array.isArray(ctl.sliders) || !ctl.sliders.length) { bad++; why = `${it.skillId} handed back no slider`; return; }
    if (fired.n) { bad++; why = `${it.skillId} unlocked on mount`; return; }
    ctl.sliders.forEach((s, si) => {
      if (s.index() === 0 || s.index() === s.values().length - 1) {
        bad++; why = `${it.skillId} slider ${si} opens on an end stop`;
      }
    });
    const stops = [];
    ctl.sliders.forEach((s, si) => s.values().forEach((_, k) => stops.push([si, k])));
    stops.slice(0, -1).forEach(([si, k]) => ctl.sliders[si].setIndex(k));
    if (fired.n) { bad++; why = `${it.skillId} unlocked before the whole range was dragged`; return; }
    const [ls, lk] = stops[stops.length - 1];
    ctl.sliders[ls].setIndex(lk);
    if (fired.n !== 1) { bad++; why = `${it.skillId} fired done ${fired.n}× on completing the range`; }
  });
  check(g, "every beat mounts, opens mid-range, and stays locked until the last stop", bad === 0, why);

  bad = 0; why = "";
  let stopsChecked = 0, worstOff = 0, hyperStopsChecked = 0;
  buildRound("q1b").forEach((it) => {
    const { ctl } = mountBeat(it);
    ctl.sliders.forEach((s) => {
      const winKey = JSON.stringify(s.specs()[0].win);
      if (!s.specs().every((sp) => JSON.stringify(sp.win) === winKey)) {
        bad++; why = `${it.skillId}: the window changes mid-drag`;
      }
      s.values().forEach((v, k) => {
        if (Math.abs(v * 2 - Math.round(v * 2)) > 1e-9) { bad++; why = `${it.skillId}: stop ${v} is neither a whole number nor a half`; }
        s.setIndex(k);
        const spec = s.spec(), gm = computeFunction(spec);
        stopsChecked++;
        if (Math.abs(gm.sx - gm.sy) > 1e-6) { bad++; why = `${it.skillId}: sx ${gm.sx.toFixed(2)} ≠ sy ${gm.sy.toFixed(2)}`; }
        if (gm.sx < 18 || gm.sx > 47) { bad++; why = `${it.skillId}: ${gm.sx.toFixed(1)} px/unit`; }
        const f = verifyFunction(spec).filter((r) => !r.ok);
        if (f.length) { bad++; why = `${it.skillId}: ${f[0].label}`; }
        const off = curveOffBy(s.graph(), spec);
        worstOff = Math.max(worstOff, off);
        if (!(off <= 0.01)) { bad++; why = `${it.skillId}: drawn curve is ${off.toFixed(3)} off funclib`; }
        /* the hyperbola's dashed asymptote CROSS — both lines, every stop */
        if (spec.curves[0].kind === "hyperbola") {
          hyperStopsChecked++;
          const xs = spec.asymptotes.filter((a) => a.of === 0 && a.x !== undefined);
          const ys = spec.asymptotes.filter((a) => a.of === 0 && a.y !== undefined);
          if (xs.length !== 1 || ys.length !== 1) {
            bad++; why = `${it.skillId}: asymptote cross incomplete (x:${xs.length} y:${ys.length})`;
          }
          const asymLines = s.graph().querySelectorAll("svg line.fg-asym");
          if (asymLines.length !== 2) { bad++; why = `${it.skillId}: SVG drew ${asymLines.length} dashed asymptote lines, wanted 2`; }
        }
      });
    });
  });
  check(g, `the drawn curve matches funclib at every slider stop (${stopsChecked} stops)`, bad === 0, why);
  check(g, `every hyperbola stop draws its dashed asymptote cross, both lines (${hyperStopsChecked} stops)`,
    hyperStopsChecked > 0 && bad === 0, why);
  info(g, `worst gap between the drawn curve and funclib: ${worstOff.toExponential(1)} units`);

  /* a FROZEN asymptote must never sit on an axis: at p = 0 or q = 0 the
     dashed line is drawn exactly on top of the solid axis and disappears
     into it, and the beat's "watch the cross" wording points at nothing
     (foreman review fix, session 3 — seen on the contact sheet). An
     asymptote the learner is DRAGGING may cross 0; one that is constant
     across every stop may not BE 0. */
  bad = 0; why = "";
  buildRound("q1b").forEach((it) => {
    const { ctl } = mountBeat(it);
    ctl.sliders.forEach((s) => {
      const perStop = s.specs().map((sp) => ({
        xs: (sp.asymptotes || []).filter((a) => a.x !== undefined).map((a) => a.x),
        ys: (sp.asymptotes || []).filter((a) => a.y !== undefined).map((a) => a.y),
      }));
      ["xs", "ys"].forEach((axis) => {
        const first = perStop[0][axis];
        first.forEach((v, idx) => {
          const constant = perStop.every((st) => st[axis][idx] === v);
          if (constant && v === 0) { bad++; why = `${it.skillId}: frozen asymptote sits on the axis (${axis === "xs" ? "x" : "y"} = 0)`; }
        });
      });
    });
  });
  check(g, "no frozen asymptote hides on an axis (dragged ones may cross it)", bad === 0, why);

  bad = 0; why = "";
  for (let rep = 0; rep < 10; rep++) {
    buildRound("q1b").forEach((it) => {
      const said = strip(L(it.prompt || "")) + " " + strip(L(it.stem || "")) + " " + strip(L(it.coach || ""));
      const answer = strip(L(it.then.answerLabel || ""));
      if (answer && said.includes(answer)) { bad++; why = `${it.skillId} states its own finding up front`; }
      if (!Array.isArray(it.then.solution) || !it.then.solution.length) { bad++; why = `${it.skillId} has no method card`; }
      if (it.then.options.length < 3 || it.then.options.length > 4) { bad++; why = `${it.skillId} offers ${it.then.options.length} options`; }
    });
  }
  check(g, "no beat reveals its finding before the commit, and every one ends in a method card", bad === 0, why);

  host.remove();
}

/* ---------- 4b. no question can lie or crop ---------- */
{
  setLang("af");
  const g = group("4b. Honesty of the picture and the wording");

  /* every curve of every generated graph must FIT the window it is drawn in.
     Fix day (2026-08-13): the ⅓-in-frame decision is now made by the ONE
     shared mostlyInFrame() helper (js/quests/_graphs.js, next to
     windowFor()) — the same function qT-transform.js's own generator
     calls — never a second private copy of the same maths. The percentage
     in the failure message is still computed locally, for a readable
     diagnostic only; it never drives the pass/fail decision.
     This loop already runs over every quest in QUESTS with no it.graph
     guard beyond "skip if absent" — now that qL/qG/qT's slideMatch expose
     their spec as it.graph (pure data, interactive items are never
     re-rendered from it — see each file's own comment), this same
     unmodified loop covers them too, closing the coverage hole that used
     to skip every qL/qG round and qT's slideMatch entirely. */
  let bad = 0, why = "";
  for (const q of QUESTS) {
    for (let rep = 0; rep < 6; rep++) {
      buildRound(q.id).forEach((it) => {
        const spec = it.graph;
        if (!spec) return;
        const { xmin, xmax, ymin, ymax } = spec.win;
        spec.curves.forEach((cv, ci) => {
          if (!mostlyInFrame(cv, spec.win)) {
            let inside = 0, total = 0;
            for (let i = 0; i <= 60; i++) {
              const x = xmin + (i / 60) * (xmax - xmin), y = mf(cv)(x);
              if (!Number.isFinite(y)) continue;
              if (cv.kind === "hyperbola" && Math.abs(x - cv.p) < 0.4) continue;
              total++;
              if (y >= ymin && y <= ymax) inside++;
            }
            bad++; why = `${q.id} curve ${ci} (${cv.kind}) only ${total ? Math.round(inside / total * 100) : 0}% in frame`;
          }
        });
        const w = xmax - xmin, h = ymax - ymin;
        if (w / h > 2.4) { bad++; why = `${q.id} window is ${w}×${h} — too wide and flat to read`; }
      });
    }
  }
  check(g, "every drawn curve is mostly inside its frame (via the shared mostlyInFrame()), and no window is a squashed strip", bad === 0, why);

  /* a "positive or negative?" question may never sample a point ON the axis */
  bad = 0; why = "";
  for (let rep = 0; rep < 60; rep++) {
    buildRound("q5").forEach((it) => {
      const p = strip(L(it.prompt || ""));
      const m = p.match(/x = (−?\d+)/);
      if (!m || !/positief of negatief|positive or negative/.test(p)) return;
      const spec = it.graph;
      if (!spec) return;
      const x = Number(m[1].replace("−", "-"));
      const y = mf(spec.curves[0])(x);
      if (!Number.isFinite(y) || Math.abs(y) < 0.5) { bad++; why = `asked about x=${x} where f(x)=${y}`; }
    });
  }
  check(g, "\"is f(x) positive or negative?\" never asks about a point on the x-axis", bad === 0, why);

  /* an inequality must never be split across lines: it has to be inside .eq */
  bad = 0; why = "";
  const holder = document.createElement("div");
  for (const q of QUESTS) {
    for (let rep = 0; rep < 6; rep++) {
      buildRound(q.id).forEach((it) => {
        const check1 = (html) => {
          if (html == null) return;
          holder.innerHTML = String(L(html));
          /* strip out everything already protected, then look for leftovers */
          holder.querySelectorAll(".eq").forEach((n) => n.remove());
          const rest = holder.textContent;
          if (/[a-z]\(x\)\s*[<>≤≥]|[<>≤≥]\s*x\s*[<>≤≥]/.test(rest)) { bad++; why = `${q.id}: "${rest.trim().slice(0, 60)}"`; }
        };
        check1(it.prompt);
        if (it.then) check1(it.then.prompt);
        (it.options || (it.then && it.then.options) || []).forEach((o) => check1(o.label));
      });
    }
  }
  check(g, "every inequality is wrapped in .eq so it can never wrap mid-expression", bad === 0, why);

  /* a diagram may never print the very answer being asked for */
  bad = 0; why = "";
  for (const q of QUESTS) {
    for (let rep = 0; rep < 8; rep++) {
      buildRound(q.id).forEach((it) => {
        const p = strip(L(it.prompt || ""));
        if (!/asimptoot|asymptote/i.test(p)) return;
        if (!/skryf|write|bereken|neer/i.test(p)) return;       // asks FOR the asymptote
        const spec = it.graph;
        if (!spec) return;
        const printed = (spec.asymptotes || []).filter((a) => a.label).map((a) => a.label);
        const answer = strip(L(it.answerLabel || ""));
        if (printed.some((lbl) => answer.includes(strip(lbl)))) {
          bad++; why = `${q.id}: sketch prints "${strip(printed[0])}" and asks for it`;
        }
      });
    }
  }
  check(g, "a sketch never prints the asymptote a question is asking for", bad === 0, why);

  /* every round must carry a picture — this app is about READING graphs.
     Exception: qB (session 3's Round B) is DELIBERATELY graph-free —
     equation-only instant recognition, speed-round format, RUN-PLAN's
     own spec for that round. */
  bad = 0; why = "";
  for (const q of QUESTS) {
    if (q.id === "qB") continue;
    for (let rep = 0; rep < 6; rep++) {
      buildRound(q.id).forEach((it) => {
        const hasPic = it.type === "interactive" || !!it.graph;
        if (!hasPic) { bad++; why = `${q.id}/${it.skillId}: "${strip(L(it.prompt)).slice(0, 50)}…" has no graph`; }
      });
    }
  }
  check(g, "every round shows a graph (no wall-of-words questions), except qB by design", bad === 0, why);

  /* qB itself: confirm it really is graph-free, in both directions —
     never leaks a graph, and never gets caught by a stray graph check */
  bad = 0; why = "";
  for (let rep = 0; rep < 20; rep++) {
    buildRound("qB").forEach((it) => {
      if (it.graph || it.type === "interactive") { bad++; why = "qB round unexpectedly carries a graph"; }
    });
  }
  check(g, "qB (Round B) never draws a graph — equation only, as designed", bad === 0, why);

  /* semicircles must be drawn round, not squashed into an ellipse */
  bad = 0; why = "";
  for (let rep = 0; rep < 40; rep++) {
    ["q2", "q3", "q5", "q7"].forEach((qid) => {
      buildRound(qid).forEach((it) => {
        const spec = it.graph || (it.then && it.then.graph);
        if (!spec || !spec.curves.some((c) => c.kind === "semicircle")) return;
        const { xmin, xmax, ymin, ymax } = spec.win;
        const shape = ((xmax - xmin) / (ymax - ymin)) / ((spec.w || 360) / (spec.h || 300));
        if (shape < 0.85 || shape > 1.18) { bad++; why = `${qid}: circle drawn ${shape.toFixed(2)}× out of round`; }
      });
    });
  }
  check(g, "a semicircle is drawn round, not as a squashed ellipse", bad === 0, why);
}

/* ---------- 4c. the square-grid window guarantees (session 1) ---------- */
{
  const g = group("4c. Square-grid windows — sx === sy, zoom clamped, nothing cropped");
  const FAMILIES = [
    ["line", () => randLine()], ["parabola", () => randParabola()],
    ["hyperbola", () => randHyperbola()], ["exp", () => randExp()],
    ["semicircle", () => randSemicircle()],
  ];

  /* sx === sy for every window this app actually draws */
  let bad = 0, why = "";
  FAMILIES.forEach(([name, make]) => {
    for (let i = 0; i < 100; i++) {
      const cv = make();
      const win = windowFor([cv]);
      if (!win) { bad++; why = `${name}: a generator-approved curve got no window`; continue; }
      const gm = computeFunction({ win, w: 360, h: 300 });
      if (Math.abs(gm.sx - gm.sy) > 1e-6) { bad++; why = `${name}: sx=${gm.sx.toFixed(3)} sy=${gm.sy.toFixed(3)}`; }
    }
  });
  check(g, "sx === sy for 100 windows of every family", bad === 0, why);

  /* px/unit stays inside the readable clamp */
  bad = 0; why = "";
  FAMILIES.forEach(([name, make]) => {
    for (let i = 0; i < 100; i++) {
      const cv = make();
      const win = windowFor([cv]);
      if (!win) continue;
      const gm = computeFunction({ win, w: 360, h: 300 });
      if (gm.sx < 18 || gm.sx > 47) { bad++; why = `${name}: ${gm.sx.toFixed(1)} px/unit`; }
    }
  });
  check(g, "px/unit stays within [18, 47] for 100 windows of every family", bad === 0, why);

  /* the parabola's turning point never hugs the frame */
  bad = 0; why = "";
  for (let i = 0; i < 200; i++) {
    const cv = randParabola();
    const win = windowFor([cv]);
    if (!win) continue;
    const tp = paraTP(cv);
    const mx = Math.min(tp.x - win.xmin, win.xmax - tp.x) / (win.xmax - win.xmin);
    const my = Math.min(tp.y - win.ymin, win.ymax - tp.y) / (win.ymax - win.ymin);
    if (mx < 0.08 || my < 0.08) { bad++; why = `TP margin ${(Math.min(mx, my) * 100).toFixed(1)}% of window`; }
  }
  check(g, "parabola TP sits ≥ 8% of the window away from every edge (200 curves)", bad === 0, why);

  /* every identity feature — TP, roots, asymptote, elbows, the bend —
     really is inside the window it was sized for */
  bad = 0; why = "";
  FAMILIES.forEach(([name, make]) => {
    for (let i = 0; i < 100; i++) {
      const cv = make();
      const win = windowFor([cv]);
      if (!win) continue;
      const f = features(cv);
      const out1 = f.xs.some((x) => x < win.xmin - 1e-6 || x > win.xmax + 1e-6)
        || f.ys.some((y) => y < win.ymin - 1e-6 || y > win.ymax + 1e-6);
      if (out1) { bad++; why = `${name}: an identity feature landed outside its own window`; }
    }
  });
  check(g, "every identity feature is inside the window (100 curves × 5 families)", bad === 0, why);
}

/* ---------- 4d. window statistics — the ported probe ----------
   Session-1 measured v1's windows as unreadable (median 1,5 px/unit on a
   parabola round, 100% of parabola rounds squashed > 1,5:1). This is that
   same probe, kept in the harness so a future regression shows up here
   instead of needing a fresh headless script. */
{
  const g = group("4d. Window statistics (ported probe) — regressions show up here");
  const SCEN = {
    "parabola alone": () => [randParabola()],
    "hyperbola alone": () => [randHyperbola()],
    "exponential alone": () => [randExp()],
    "line alone": () => [randLine()],
    "semicircle alone": () => [randSemicircle()],
    "parabola + line": () => [randParabola(), randLine()],
    "hyperbola + line": () => [randHyperbola(), randLine()],
    "exponential + line": () => [randExp(), randLine()],
    "parabola + parabola": () => [randParabola(), randParabola()],
  };
  const N = 500;
  let anySquash = false, anyOffRange = false;
  Object.entries(SCEN).forEach(([name, make]) => {
    const pxu = [], squash = [], nullCount = [];
    for (let i = 0; i < N; i++) {
      const curves = make();
      const win = windowFor(curves);
      if (!win) { nullCount.push(1); continue; }
      const gm = computeFunction({ win, w: 360, h: 300 });
      pxu.push(gm.sx);
      squash.push(Math.max(gm.sx / gm.sy, gm.sy / gm.sx));
    }
    const med = (a) => (a.length ? a.slice().sort((x, y) => x - y)[Math.floor(a.length / 2)] : NaN);
    const worstSquash = squash.length ? Math.max(...squash) : NaN;
    if (worstSquash > 1.001) anySquash = true;
    if (pxu.some((v) => v < 18 || v > 47)) anyOffRange = true;
    info(g, `${name.padEnd(20)} median ${med(pxu).toFixed(1)} px/u · worst squash ${worstSquash.toFixed(3)}× · null (regenerated) ${nullCount.length}/${N}`);
  });
  check(g, "no window is ever squashed (square-grid forces sx = sy)", !anySquash);
  check(g, "no window ever falls outside the [18, 47] px/unit clamp", !anyOffRange);
}

/* ---------- 7. Round B — equation-only recognition (session 3) ----------
   No graph is drawn (checked in §4b already) — this section checks the
   content itself: every family actually turns up, every numeric chip is
   wrapped in .eq, and the closed (family, feature) → has-it table holds
   for every round generated (the "no 'geen' round whose curve HAS the
   asked feature" rule, and its converse: no valued round for a family
   that never has that feature). */
{
  setLang("af");
  const g = group("7. Round B (qB) — equation-only recognition");

  const classifyFamily = (stemHtml) => {
    if (/²/.test(stemHtml)) return "parabola";
    if (/frac/.test(stemHtml)) return "hyperbola";
    if (/<sup>/.test(stemHtml)) return "exp";
    return "line";
  };
  const classifyFeature = (promptText) => {
    if (/horisontale|horizontal/i.test(promptText)) return "hAsym";
    if (/vertikale|vertical/i.test(promptText)) return "vAsym";
    if (/simmetrie|symmetry/i.test(promptText)) return "axisSym";
    return null;
  };
  /* the same closed table qB.js encodes — kept independently here on
     purpose, so a bug in the generator's own table doesn't also hide
     itself from the check that is supposed to catch it */
  const HAS_FEATURE = {
    line: { hAsym: false, vAsym: false },
    parabola: { hAsym: false, vAsym: false, axisSym: true },
    hyperbola: { hAsym: true, vAsym: true },
    exp: { hAsym: true, vAsym: false },
  };

  const REPS = 200;
  const rounds = [];
  let genBad = 0, genWhy = "";
  for (let rep = 0; rep < REPS; rep++) {
    let items = [];
    try { items = buildRound("qB"); } catch (e) { genBad++; genWhy = "threw: " + e.message; break; }
    items.forEach((it) => rounds.push(it));
  }
  check(g, `qB builds ${REPS} rounds without throwing`, genBad === 0, genWhy);

  /* classify every round, generator for every family */
  let bad = 0, why = "";
  const seenFamilies = new Set();
  const classified = [];
  rounds.forEach((it) => {
    const stemHtml = String(L(it.stem || ""));
    const promptText = strip(L(it.prompt || ""));
    const family = classifyFamily(stemHtml);
    const feature = classifyFeature(promptText);
    if (!family || !feature) { bad++; why = `could not classify round: "${promptText}"`; return; }
    seenFamilies.add(family);
    classified.push({ it, family, feature });
  });
  check(g, `every round classifies to a known (family, feature) pair (${rounds.length} rounds)`, bad === 0, why);
  check(g, `all four families are generated (line, parabola, hyperbola, exp) across ${rounds.length} rounds`,
    ["line", "parabola", "hyperbola", "exp"].every((f) => seenFamilies.has(f)),
    `saw: ${[...seenFamilies].join(", ")}`);

  /* the closed (family, feature) → has-it table holds for every round:
     no "geen"/"none" round whose curve HAS the asked feature, and no
     valued round for a family that never has that feature */
  bad = 0; why = "";
  classified.forEach(({ it, family, feature }) => {
    const answerText = strip(L(it.answerLabel || ""));
    const isNone = /^(geen|none)$/i.test(answerText.trim());
    const shouldHave = HAS_FEATURE[family][feature];
    if (shouldHave === isNone) {
      bad++; why = `${family}/${feature}: answer "${answerText}" but curve ${shouldHave ? "HAS" : "lacks"} the feature`;
    }
  });
  check(g, "no 'geen'/'none' round whose curve HAS the asked feature (and no valued round whose family never has it)",
    bad === 0, why);

  /* every numeric chip ("y = ..." / "x = ...") must be wrapped in .eq —
     the "geen"/"none" chip is prose, not notation, so it is exempt */
  bad = 0; why = "";
  rounds.forEach((it) => {
    it.options.forEach((o) => {
      const raw = String(L(o.label));

    });

  check(g, "every numeric asymptote/symmetry chip is wrapped in .eq", bad === 0, why);

  /* a flash round is a drill, not a coin flip: degenerate parameter draws
     (p = 0, q = 0, p = −q …) collapse decoys into each other, mc() dedupes
     them away, and the round could shrink to two buttons — the generator
     must redraw instead (foreman review fix, session 3) */
  bad = 0; why = "";
  rounds.forEach((it) => {
    if (it.options.length !== 4) { bad++; why = `a qB round has ${it.options.length} options`; }
  });
  check(g, `every qB round deals a full hand of 4 options (${rounds.length} rounds)`, bad === 0, why);
}

      const svg = box.querySelector("svg");

      fire("pointermove", 0.2);              // a backwards drag — must be silently ignored

/* ---------- 9. Round D (q6) — pre-drawn cuts, stamp, sweep, scaffold-on-error (session 5) ----------
   v1's q6-sweep.js (learner-placed cutSockets) is retired. This round
   pre-draws the cut lines, stamps + / − between the two curves (Law 4's
   painting move), sweeps a plain scan line to confirm by eye, then asks
   for the answer from a short list. §3/§4/§4b already exercise q6
   generically; these are the session-5-specific promises RUN-PLAN calls
   out by name, checked independently of the generator's own logic
   wherever a truly independent check is possible. */
{
  setLang("af");
  const g = group("9. Round D (q6) — compare f vs g: pre-drawn cuts, stamp, scaffold-on-error");
  const host = document.createElement("div");
  host.style.position = "absolute"; host.style.left = "-9999px"; host.style.width = "360px";
  document.body.appendChild(host);

  const REPS = 25;
  const items = [];
  for (let rep = 0; rep < REPS; rep++) {
    buildRound("q6").filter((it) => it.skillId === "compareSweep").forEach((it) => items.push(it));
  }
  check(g, `compareSweep builds across ${REPS} rounds`, items.length > 0, `saw ${items.length}`);

  /* 9a. the pre-drawn cut lines sit EXACTLY at the computed
     intersections and asymptote — never rounded, never approximated */
  let bad = 0, why = "", cutsChecked = 0;
  items.slice(0, 15).forEach((it) => {
    const box = document.createElement("div");
    host.appendChild(box);
    try { it.build(box, () => {}, () => {}, () => {}, () => {}); }
    catch (e) { bad++; why = `threw: ${e.message}`; return; }
    const dc = it.debugCurves;
    if (!dc || !dc.win) { bad++; why = "no debugCurves exposed for verification"; return; }
    const gm = computeFunction({ win: dc.win, w: 360, h: 300 });
    const lines = [...box.querySelectorAll("line.fg-vline")];
    if (lines.length !== dc.cuts.length) { bad++; why = `drew ${lines.length} cut lines, wanted ${dc.cuts.length}`; return; }
    const drawnXs = lines.map((l) => gm.xAt(Number(l.getAttribute("x1")))).sort((a, b) => a - b);
    const wantXs = dc.cuts.map((c) => c.x).sort((a, b) => a - b);
    wantXs.forEach((wx, i) => {
      cutsChecked++;
      if (Math.abs(drawnXs[i] - wx) > 0.02) { bad++; why = `cut ${i}: drawn x=${drawnXs[i].toFixed(3)} vs computed x=${wx.toFixed(3)}`; }
    });
  });
  check(g, `pre-drawn cut lines sit exactly at computed intersections/asymptotes (${cutsChecked} cuts checked)`, bad === 0, why);

  /* 9b. stamping the true sign of f − g at every section (evaluated
     raw, independent of aboveAt()) reveals every mark as correct */
  bad = 0; why = ""; let stampsChecked = 0;
  items.slice(0, 15).forEach((it) => {
    const box = document.createElement("div");
    host.appendChild(box);
    try { it.build(box, () => {}, () => {}, () => {}, () => {}); }
    catch (e) { bad++; why = `threw: ${e.message}`; return; }
    const dc = it.debugCurves;
    if (!dc) { bad++; why = "no debugCurves exposed"; return; }
    const hits = [...box.querySelectorAll("rect.iv-hit")];
    if (hits.length !== dc.secs.length) { bad++; why = `${hits.length} stamp targets, wanted ${dc.secs.length} sections`; return; }
    const ff = mf(dc.f), fg = mf(dc.g);
    hits.forEach((hit, i) => {
      const raw = ff(dc.secs[i].mid) - fg(dc.secs[i].mid);
      const taps = raw > 0 ? 1 : 2;                 // blank→+ is one tap, blank→+→− is two
      for (let t = 0; t < taps; t++) hit.dispatchEvent(new PointerEvent("pointerdown", { bubbles: true, cancelable: true }));
    });
    stampsChecked += hits.length;
    const slots = [...box.querySelectorAll("rect.iv-signslot")];
    if (slots.length !== hits.length) { bad++; why = "stamp slot count does not match hit-target count"; return; }
    slots.forEach((s, i) => {
      if (s.style.stroke !== "var(--good)") { bad++; why = `section ${i}: stamped the funclib-true sign but was marked wrong (stroke=${s.style.stroke})`; }
    });
  });
  check(g, `stamping the true sign of f − g (raw, independent of aboveAt) reveals every mark as correct (${stampsChecked} stamps)`, bad === 0, why);

  /* 9c. the scaffold is hidden by default and appears only in a
     wrong-answer nudge — checked on the RAW (unstripped) HTML, since
     strip() would remove the very markup being looked for */
  bad = 0; why = "";
  items.slice(0, 20).forEach((it) => {
    const rawSaid = [it.prompt, it.stem, it.coach, ...(it.hints || [])].map((v) => String(L(v || ""))).join(" ");
    if (rawSaid.includes("fg-shade")) { bad++; why = "the prompt/stem/coach/hints leak the shaded scaffold before any answer"; return; }
    const wrongMiscs = (it.then.options || []).filter((o) => !o.correct).map((o) => String(L(o.misc || "")));
    if (!wrongMiscs.length || !wrongMiscs.every((m) => m.includes("fg-shade"))) {
      bad++; why = "a wrong option's nudge does not carry the shaded-region scaffold";
    }
  });
  check(g, "the shaded-region scaffold is absent by default and present in every wrong-answer nudge", bad === 0, why);

  /* 9d. the answer interval matches the + (f-above-g) sections — the
     sign recomputed raw, independent of aboveAt(), the string rebuilt
     independently through the same public answerString() used in §5 */
  bad = 0; why = "";
  items.slice(0, 15).forEach((it) => {
    const dc = it.debugCurves;
    if (!dc) return;
    const ff = mf(dc.f), fg = mf(dc.g);
    const rawChosen = dc.secs.filter((s) => {
      const raw = ff(s.mid) - fg(s.mid);
      return dc.wantF ? raw > 0 : raw < 0;
    });
    const expected = strip(answerString(rawChosen, dc.cuts, dc.win, { strict: true, lang: "af" }));
    const got = strip(L(it.then.answerLabel || ""));
    if (expected !== got) { bad++; why = `expected "${expected}" but answerLabel reads "${got}"`; }
  });
  check(g, "the answer interval matches the + (f-above-g) sections, recomputed independently of aboveAt()", bad === 0, why);

  /* 9e. the retired v1 skills (learner-placed cutSockets) are gone;
     the new stamp-and-sweep round is in; the quest map is unchanged */
  bad = 0; why = "";
  let sawOld = false, sawNew = false;
  for (let rep = 0; rep < 10; rep++) {
    buildRound("q6").forEach((it) => {
      if (it.skillId === "topSweep" || it.skillId === "whichCuts") sawOld = true;
      if (it.skillId === "compareSweep") sawNew = true;
    });
  }
  const ids = QUESTS.map((q) => q.id);
  check(g, "q6's retired v1 skills (topSweep/whichCuts) are gone and the new compareSweep round is in, QUESTS holds 12 (batch 2 added qL/qG/qT, batch 3 added qE)",
    !sawOld && sawNew && ids.length === 12 && ids.includes("q6"), `ids: ${ids.join(", ")}`);

  /* 9f. a two-part answer must show real space around "of"/"or" INSIDE an
     option button. .opt is display:flex, and flex trims the edge spaces off
     a text run, so a plain " of " renders glued as "x < 1of2 < x < 5" —
     Megan caught exactly that on her phone (2026-08-12). Measured, not
     assumed: the gap between the two interval spans must be clearly wider
     than the join word alone. Never relax this one. */
  const joinBad = [];
  for (const lang of ["af", "en"]) {
    const word = lang === "en" ? "or" : "of";
    const parts = ["<span class='eq'>x &lt; 1</span>", "<span class='eq'>2 &lt; x &lt; 5</span>"];
    const probe = document.createElement("div");
    probe.className = "opt";
    probe.style.cssText = "width:340px;position:absolute;left:-9999px";
    const gapOf = (html) => {
      probe.innerHTML = html;
      document.body.appendChild(probe);
      const sp = probe.querySelectorAll("span.eq");
      const gap = sp[1].getBoundingClientRect().left - sp[0].getBoundingClientRect().right;
      probe.remove();
      return gap;
    };
    const glued = gapOf(parts.join(word));           // no spaces at all
    const real = gapOf(joinIntervals(parts, lang));  // what the app ships
    if (!(real > glued + 4)) joinBad.push(`${lang}: glued ${glued.toFixed(1)}px vs shipped ${real.toFixed(1)}px`);
  }
  check(g, `a two-part answer keeps a real space each side of "of"/"or" inside a flex option button`,
    joinBad.length === 0, joinBad.join(" · "));

  /* 9g. the scan line slides BOTH ways. Megan asked for this while picking
     an answer — she wants to run the line back over a section and look
     again (2026-08-12). Sliding back must not un-finish the round either.
     NOTE the deliberate asymmetry with check 8b: the CLIMB stays one-way
     forever, because that is what teaches left-to-right reading. Two
     mechanics, two rules — never unify them. */
  {
    const cv = randLine();
    const win = windowFor([cv]);
    const spec = specFor([cv], { win });
    const midX = (win.xmin + win.xmax) / 2;
    const secs = [
      { x0: win.xmin, x1: midX, mid: (win.xmin + midX) / 2 },
      { x0: midX, x1: win.xmax, mid: (midX + win.xmax) / 2 },
    ];
    const entered = [];
    const box = document.createElement("div");
    host.appendChild(box);
    const ctl = sweep(box, { spec, sections: secs, plain: true, open: true, onEnter: (s, i) => entered.push(i) });
    const svg = box.querySelector("svg");
    const r = svg.getBoundingClientRect();
    if (!r.width || !r.height) {
      info(g, "no live layout in this environment — the scan-line drag was not probed");
    } else {
      const scanX = () => +svg.querySelector(".iv-scan").getAttribute("x1");
      const fire = (type, fracX) => svg.dispatchEvent(new PointerEvent(type, {
        bubbles: true, cancelable: true, pointerId: 1,
        clientX: r.left + r.width * fracX, clientY: r.top + r.height * 0.5,
      }));
      fire("pointerdown", 0.15);
      fire("pointermove", 0.92);
      const atRight = scanX();
      fire("pointermove", 0.28);
      const backLeft = scanX();
      check(g, "the scan line slides back to the left when dragged back, so a section can be re-checked",
        backLeft < atRight - 1, `swept to ${atRight.toFixed(1)}px, dragged back to ${backLeft.toFixed(1)}px`);
      check(g, "sliding the scan line back does not un-finish the round (the furthest section reached is what counts)",
        ctl.isFinished() === true, `sections entered: ${entered.join(" → ")}`);
    }
  }

  host.remove();
}

/* ---------- 10. Megan's batch-1 rulings, 2026-08-12 evening ----------
   Two calls she made after playing batch 1 on her phone. Both are one-line
   changes that a later refactor could silently undo, so they get their own
   checks. Never relax either without a new ruling from her. */
{

    QUESTS.every((q) => secondChanceAllowed(q, true)));

  /* 10c. no asymptote in Round D may sit ON an axis. A dashed line drawn
     over the x- or y-axis is invisible, and the notation round explicitly
     tells the learner to look at it ("the dashed line at the left edge is
     an asymptote"). Found 2026-08-12 while play-testing the second chance:
     nicePair() hard-coded p = 0, so EVERY hyperbola pair had its vertical
     asymptote hidden under the y-axis. Same principle as the batch-1
     frozen-asymptote rule — never relax it. */
  const onAxis = [];
  for (let rep = 0; rep < 30; rep++) {
    buildRound("q6").forEach((it) => {
      (it.graph?.asymptotes || []).forEach((as) => {
        if (as.x === 0) onAxis.push(`${it.skillId}: vertical asymptote on the y-axis`);
        if (as.y === 0) onAxis.push(`${it.skillId}: horizontal asymptote on the x-axis`);
      });
      /* extended 2026-08-13: nicePair() built meets = [r1+p, r2+p] with no
         guard against 0, so a PRE-DRAWN CUT LINE (compareSweep) or a
         notation band edge could sit exactly on the y-axis and vanish —
         same invisibility bug, different field. compareSweep now exposes
         its built spec as it.graph (data only, see q6-compare.js) so this

      });

    onAxis.length === 0, [...new Set(onAxis)].join(" · "));

  const offAxisBad = [];
  for (let i = 0; i < 200; i++) {
    const cv = randHyperbolaOffAxis();
    if (asymOnAxis(cv)) offAxisBad.push(`a=${cv.a} p=${cv.p} q=${cv.q}`);
  }
  check(g, "randHyperbolaOffAxis() never returns a hyperbola with an asymptote on an axis (200 samples)",
    offAxisBad.length === 0, offAxisBad.slice(0, 3).join(" · "));

  const rawUsers = [];
  for (const f of ["./js/quests/qL-lengths.js", "./js/quests/qG-gradient.js", "./js/quests/qT-transform.js"]) {
    const src = await (await fetch(f, { cache: "reload" })).text();
    if (/randHyperbola\s*\(/.test(src.replace(/randHyperbolaOffAxis\s*\(/g, "SAFE("))) rawUsers.push(f);
    if (/kind:\s*"hyperbola"[^}]*\bp:\s*0\b/.test(src)) rawUsers.push(`${f} (hard-coded p: 0)`);
  }
  check(g, "the batch-2 quests draw hyperbolas only through randHyperbolaOffAxis(), never the raw generator",
    rawUsers.length === 0, rawUsers.join(" · "));
}

/* ---------- 11. Quest qL (Lengths) — batch 2, session 1 ----------
   Every length is |difference| of two numbers the learner can already
   see (Law 1 — no algebra). The maths is checked independently of the
   generator: recomputed from the raw marked points via funclib's own
   lengthBetween(), never trusting the generator's own subtraction. */
{
  setLang("af");
  const g = group("11. Quest qL (Lengths) — batch 2");

  const REPS = 20;
  const items = [];
  let genBad = 0, genWhy = "";
  for (let rep = 0; rep < REPS; rep++) {
    let round = [];
    try { round = buildRound("qL"); } catch (e) { genBad++; genWhy = "threw: " + e.message; break; }
    round.forEach((it) => items.push(it));
  }
  check(g, `qL builds ${REPS} full rounds without throwing`, genBad === 0, genWhy);

  /* 11a. independent maths: the answer is the |difference| of the raw
     points the round exposes, recomputed here — not copied from it */
  let bad = 0, why = "", checked = 0;
  items.forEach((it) => {
    const dc = it.debugLen;
    if (!dc) { bad++; why = `${it.skillId}: no debugLen exposed for verification`; return; }
    let expected;
    if (dc.diff === "y") expected = lengthBetween(dc.points[0].y, dc.points[1].y);
    else if (dc.diff === "x") expected = lengthBetween(dc.points[0].x, dc.points[1].x);
    else if (dc.diff === "y0") expected = lengthBetween(dc.points[0].y, 0);
    else if (dc.diff === "x0") expected = lengthBetween(dc.points[0].x, 0);
    else { bad++; why = `${it.skillId}: unknown diff kind "${dc.diff}"`; return; }
    checked++;
    if (Math.abs(expected - dc.correct) > 1e-9) { bad++; why = `${it.skillId}: recomputed ${expected} ≠ generator's ${dc.correct}`; return; }
    const got = strip(L(it.then.answerLabel || ""));
    if (got !== fmtComma(expected)) { bad++; why = `${it.skillId}: answerLabel "${got}" ≠ recomputed ${fmtComma(expected)}`; }
  });
  check(g, `the answer is the independently-recomputed |difference| (${checked} rounds)`, bad === 0, why);

  /* 11b. every round deals a full hand of 4 distinct options */
  bad = 0; why = "";
  items.forEach((it) => {
    const opts = it.then.options;
    if (opts.length !== 4) { bad++; why = `${it.skillId}: ${opts.length} options`; return; }
    const labels = opts.map((o) => strip(L(o.label)));
    if (new Set(labels).size !== 4) { bad++; why = `${it.skillId}: duplicate options — ${labels.join(" | ")}`; }
  });
  check(g, `every qL round deals a full hand of 4 distinct options (${items.length} rounds)`, bad === 0, why);

  /* 11c. the window really contains every point the round is about —
     windowFor() has silently cropped a round's own point before */
  bad = 0; why = "";
  items.forEach((it) => {
    const dc = it.debugLen;
    if (!dc) return;
    dc.points.forEach((p) => {
      if (p.x < dc.win.xmin - 1e-6 || p.x > dc.win.xmax + 1e-6 || p.y < dc.win.ymin - 1e-6 || p.y > dc.win.ymax + 1e-6) {
        bad++; why = `${it.skillId}: point (${p.x};${p.y}) sits outside its own window`;
      }
    });
  });
  check(g, "the window contains every point a qL round is about", bad === 0, why);

  /* 11d. no prompt/coach states its own answer. `stem` is deliberately
     excluded here: it is the curve's EQUATION, and a coefficient can
     coincidentally share a digit with a length that curve has nothing
     to do with (e.g. f(x) = 3^x next to an unrelated answer of "3") —
     that is not a spoiler, it is arithmetic coincidence. The real Law 7
     promise — the instructional SENTENCE never states its own finding —
     is what prompt+coach check. */
  bad = 0; why = "";
  items.forEach((it) => {
    const said = strip(L(it.prompt || "")) + " " + strip(L(it.coach || ""));
    const answer = strip(L(it.then.answerLabel || ""));
    if (answer && said.includes(answer)) { bad++; why = `${it.skillId}: "${said.slice(0, 70)}" contains its own answer "${answer}"`; }
  });
  check(g, "no qL prompt/coach contains its own answer", bad === 0, why);
}

/* ---------- 12. Quest qG (Average gradient) — batch 2, session 1 ----------
   m = Δy/Δx, the gradient of the chord (her p59). The maths is checked
   independently of the generator: avgGradient()/gradientStr() recomputed
   from the raw marked points, never trusting the generator's own dy/dx. */
{
  setLang("af");
  const g = group("12. Quest qG (Average gradient) — batch 2");

  const REPS = 20;
  const items = [];
  let genBad = 0, genWhy = "";
  for (let rep = 0; rep < REPS; rep++) {
    let round = [];
    try { round = buildRound("qG"); } catch (e) { genBad++; genWhy = "threw: " + e.message; break; }
    round.forEach((it) => items.push(it));
  }
  check(g, `qG builds ${REPS} full rounds without throwing`, genBad === 0, genWhy);

  /* 12a. independent maths: avgGradient()/gradientStr() on the RAW
     marked points, never the generator's own dy/dx or winner pick */
  let bad = 0, why = "", checked = 0;
  items.forEach((it) => {
    const dc = it.debugGrad;
    if (!dc) { bad++; why = `${it.skillId}: no debugGrad exposed for verification`; return; }
    if (dc.mAB !== undefined) {
      /* gradSteeper: two chords, four points */
      const [A, Bp, Cp, D] = dc.points;
      const mAB = Math.abs(avgGradient(A.y, Bp.y, A.x, Bp.x));
      const mCD = Math.abs(avgGradient(Cp.y, D.y, Cp.x, D.x));
      checked++;
      if (Math.abs(mAB - dc.mAB) > 1e-9 || Math.abs(mCD - dc.mCD) > 1e-9) {
        bad++; why = `${it.skillId}: recomputed mAB=${mAB.toFixed(3)},mCD=${mCD.toFixed(3)} ≠ generator's ${dc.mAB.toFixed(3)},${dc.mCD.toFixed(3)}`; return;
      }
      const wantWinner = mAB > mCD ? "AB" : "CD";
      const gotWinner = strip(L(it.then.options.find((o) => o.correct).label));
      if (gotWinner !== wantWinner) { bad++; why = `${it.skillId}: recomputed winner ${wantWinner} ≠ marked-correct option "${gotWinner}"`; }
    } else {
      /* gradNumber / gradSign: one chord, two points */
      const [A, Bp] = dc.points;
      const m = avgGradient(A.y, Bp.y, A.x, Bp.x);
      checked++;
      if (Math.abs(m * dc.dx - dc.dy) > 1e-9) { bad++; why = `${it.skillId}: recomputed Δy=${(m * dc.dx).toFixed(3)} ≠ generator's Δy=${dc.dy}`; return; }
      const answerText = strip(L(it.then.answerLabel || ""));
      if (it.skillId === "gradNumber") {
        const wantStr = strip(gradientStr(dc.dy, dc.dx));
        if (!answerText.includes(wantStr)) { bad++; why = `${it.skillId}: answerLabel "${answerText}" does not contain the recomputed gradient "${wantStr}"`; }
      } else if (it.skillId === "gradSign") {
        const wantWord = m > 0 ? "positief" : "negatief";
        if (!answerText.toLowerCase().includes(wantWord)) { bad++; why = `${it.skillId}: recomputed sign "${wantWord}" is not reflected in answerLabel "${answerText}"`; }
      }
    }
  });
  check(g, `the average gradient is the independently-recomputed Δy/Δx, and the marked-correct option matches it (${checked} rounds)`, bad === 0, why);

  /* 12b. every round deals a full hand of 4 distinct options */
  bad = 0; why = "";
  items.forEach((it) => {
    const opts = it.then.options;
    if (opts.length !== 4) { bad++; why = `${it.skillId}: ${opts.length} options`; return; }
    const labels = opts.map((o) => strip(L(o.label)));
    if (new Set(labels).size !== 4) { bad++; why = `${it.skillId}: duplicate options — ${labels.join(" | ")}`; }
  });
  check(g, `every qG round deals a full hand of 4 distinct options (${items.length} rounds)`, bad === 0, why);

  /* 12c. the window really contains every point the round is about */
  bad = 0; why = "";
  items.forEach((it) => {
    const dc = it.debugGrad;
    if (!dc) return;
    dc.points.forEach((p) => {
      if (p.x < dc.win.xmin - 1e-6 || p.x > dc.win.xmax + 1e-6 || p.y < dc.win.ymin - 1e-6 || p.y > dc.win.ymax + 1e-6) {
        bad++; why = `${it.skillId}: point (${p.x};${p.y}) sits outside its own window`;
      }
    });
  });
  check(g, "the window contains every point a qG round is about", bad === 0, why);

  /* 12d. no prompt/coach states its own answer (stem excluded — see qL's
     11d comment: an equation coefficient is not a spoiler of an unrelated
     numeric answer, it is arithmetic coincidence) */
  bad = 0; why = "";
  items.forEach((it) => {
    const said = strip(L(it.prompt || "")) + " " + strip(L(it.coach || ""));
    const answer = strip(L(it.then.answerLabel || ""));
    if (answer && said.includes(answer)) { bad++; why = `${it.skillId}: "${said.slice(0, 70)}" contains its own answer "${answer}"`; }
  });
  check(g, "no qG prompt/coach contains its own answer", bad === 0, why);
}

/* ---------- 13. Quest qT (Transformations) — batch 2, session 2 ----------
   See the move, then name it (Law 1: no algebra — every option is either
   read off a picture or built by adding/subtracting a whole number to p/q,
   never solved for). Every check here recomputes independently of the
   generator: it never trusts debugTransform's own arithmetic, only the
   raw p/q values it exposes. */
{
  setLang("af");
  const g = group("13. Quest qT (Transformations) — batch 2, session 2");

  const REPS = 20;
  const items = [];
  let genBad = 0, genWhy = "";
  for (let rep = 0; rep < REPS; rep++) {
    let round = [];
    try { round = buildRound("qT"); } catch (e) { genBad++; genWhy = "threw: " + e.message; break; }
    round.forEach((it) => items.push(it));
  }
  check(g, `qT builds ${REPS} full rounds without throwing`, genBad === 0, genWhy);

  const eqStrFor = (family, cv, name) => (family === "parabola" ? eqTPStr(cv, name) : eqStr(cv, name));

  /* 13a. the image curve really is where the maths says — recomputed here
     from the exposed base p/q and the exposed dp/dq, never trusting the
     generator's own `image`/`correctCv`/`target` field */
  let bad = 0, why = "", checked = 0;
  items.forEach((it) => {
    const dc = it.debugTransform;
    if (!dc) { bad++; why = `${it.skillId}: no debugTransform exposed for verification`; return; }
    if (dc.kind === "nameMove") {
      checked++;
      const wantP = (dc.base.p || 0) + dc.dp, wantQ = (dc.base.q || 0) + dc.dq;
      if (dc.image.p !== wantP || dc.image.q !== wantQ) {
        bad++; why = `${it.skillId}: image p/q (${dc.image.p};${dc.image.q}) ≠ recomputed (${wantP};${wantQ})`; return;
      }
    } else if (dc.kind === "pickEquation") {
      checked++;
      const wantP = (dc.base.p || 0) + dc.dp, wantQ = (dc.base.q || 0) + dc.dq;
      if (dc.correctCv.p !== wantP || dc.correctCv.q !== wantQ) {
        bad++; why = `${it.skillId}: correct option p/q (${dc.correctCv.p};${dc.correctCv.q}) ≠ recomputed (${wantP};${wantQ})`; return;
      }
      const gotLabel = strip(L(it.options.find((o) => o.correct).label));
      const wantLabel = strip(EQ(eqStrFor(dc.family, dc.correctCv, "g(x)")));
      if (gotLabel !== wantLabel) { bad++; why = `${it.skillId}: marked-correct option "${gotLabel}" ≠ recomputed "${wantLabel}"`; }
    } else if (dc.kind === "reflection") {
      checked++;
      /* independent recompute of both reflections from the raw base, never
         trusting the generator's own reflectX/reflectY output */
      const b = dc.base;
      const rx = dc.family === "line" ? { a: -b.a, q: -b.q } : { a: -b.a, p: b.p, q: -b.q };
      const ry = dc.family === "line" ? { a: -b.a, q: b.q }
        : dc.family === "parabola" ? { a: b.a, p: -b.p, q: b.q } : { a: -b.a, p: -b.p, q: b.q };
      const want = dc.axis === "x" ? rx : ry;
      if (dc.image.a !== want.a || (dc.image.p || 0) !== (want.p || 0) || dc.image.q !== want.q) {
        bad++; why = `${it.skillId}: image (a=${dc.image.a},p=${dc.image.p},q=${dc.image.q}) ≠ recomputed reflection`; return;
      }
    } else if (dc.kind === "slideMatch") {
      checked++;
      const want = (dc.base[dc.axis] || 0) + (dc.axis === "p"
        ? (dc.dir === "right" ? dc.k : dc.dir === "left" ? -dc.k : 0)
        : (dc.dir === "up" ? dc.k : dc.dir === "down" ? -dc.k : 0));
      if (dc.targetVal !== want) { bad++; why = `${it.skillId}: targetVal ${dc.targetVal} ≠ recomputed ${want}`; }
    } else { bad++; why = `${it.skillId}: unknown debugTransform.kind "${dc.kind}"`; }
  });
  check(g, `the image/target/option curve is exactly where the maths says (${checked} rounds)`, bad === 0, why);

  /* 13b. every mc round in qT deals a full hand of 4 distinct options */
  bad = 0; why = "";
  items.forEach((it) => {
    const q = it.type === "interactive" ? it.then : it;
    if (!q) return;
    const opts = q.options;
    if (opts.length !== 4) { bad++; why = `${it.skillId}: ${opts.length} options`; return; }
    if (opts.filter((o) => o.correct).length !== 1) { bad++; why = `${it.skillId}: not exactly one correct option`; return; }
    const labels = opts.map((o) => strip(L(o.label)));
    if (new Set(labels).size !== 4) { bad++; why = `${it.skillId}: duplicate options — ${labels.join(" | ")}`; }
  });
  check(g, `every qT round deals a full hand of 4 distinct options with exactly one correct (${items.length} rounds)`, bad === 0, why);

  /* 13c. both curves sit inside the window, whenever a picture is drawn —
     recomputed from debugTransform's raw base/image/target, never trusting
     the spec the generator already built */
  bad = 0; why = "";
  items.forEach((it) => {
    const dc = it.debugTransform;
    if (!dc || !dc.win) return;
    const curves = [dc.base, dc.image, dc.target].filter(Boolean);
    curves.forEach((cv) => {
      const feats = features(cv);
      feats.xs.forEach((x) => { if (x < dc.win.xmin - 1e-6 || x > dc.win.xmax + 1e-6) { bad++; why = `${it.skillId}: an x feature (${x.toFixed(2)}) of ${cv.kind} sits outside its own window`; } });
      feats.ys.forEach((y) => { if (y < dc.win.ymin - 1e-6 || y > dc.win.ymax + 1e-6) { bad++; why = `${it.skillId}: a y feature (${y.toFixed(2)}) of ${cv.kind} sits outside its own window`; } });
    });
  });
  check(g, "every drawn curve's identity features sit inside its own window", bad === 0, why);

  /* 13d. no prompt/stem/coach states its own answer */
  bad = 0; why = "";
  items.forEach((it) => {
    const said = strip(L(it.prompt || "")) + " " + strip(L(it.stem || "")) + " " + strip(L(it.coach || ""));
    const q = it.type === "interactive" ? it.then : it;
    const answer = strip(L((q && q.answerLabel) || ""));
    if (answer && said.includes(answer)) { bad++; why = `${it.skillId}: "${said.slice(0, 70)}" contains its own answer "${answer}"`; }
  });
  check(g, "no qT prompt/stem/coach contains its own answer", bad === 0, why);

  /* 13e. the slideMatch round's read-back matches funclib: dragging the
     slider to the exposed target index really fires the unlock, and the
     move it then asks the learner to name is exactly base → target,
     recomputed from the raw axis/value pair, not copied from the item */
  {
    const host = document.createElement("div");
    host.style.position = "absolute"; host.style.left = "-9999px"; host.style.width = "360px";
    document.body.appendChild(host);
    let bad2 = 0, why2 = "", tested = 0;
    items.filter((it) => it.skillId === "slideMatch").forEach((it) => {
      const dc = it.debugTransform;
      if (!dc) { bad2++; why2 = "no debugTransform exposed"; return; }
      const box = document.createElement("div");
      host.appendChild(box);
      let fired = 0;
      let ctl;
      try { ctl = it.build(box, () => { fired++; }, () => {}, () => {}, () => {}); }
      catch (e) { bad2++; why2 = `threw: ${e.message}`; return; }
      tested++;
      if (fired) { bad2++; why2 = `${it.skillId}: unlocked on mount`; return; }
      ctl.sliders[0].setIndex(dc.targetIdx);
      if (fired !== 1) { bad2++; why2 = `${it.skillId}: fired done ${fired}× when the slider reached the target`; return; }
      /* the move named in the follow-up mc() must match base → target,
         recomputed from the raw axis/value pair funclib was handed */
      const wantDelta = dc.targetVal - (dc.base[dc.axis] || 0);
      const wantDir = dc.axis === "p" ? (wantDelta > 0 ? "right" : "left") : (wantDelta > 0 ? "up" : "down");
      if (wantDir !== dc.dir || Math.abs(wantDelta) !== dc.k) {
        bad2++; why2 = `${it.skillId}: recomputed move ${wantDir} ${Math.abs(wantDelta)} ≠ generator's ${dc.dir} ${dc.k}`;
      }
    });
    check(g, `slideMatch: reaching the target index unlocks the question, and the named move matches the raw axis/value pair (${tested} rounds)`, bad2 === 0, why2);
    host.remove();
  }
}

/* ---------- 14. Intro cutscenes — every beat renders honestly (fix-day, bug 1) ----------
   renderIntro() (js/play.js) calls renderFunction(beat.spec) with no null
   guard — a null spec (windowFor() giving up because a curve's own identity
   features cannot fit an honest window) throws a TypeError the instant the
   "Watch first" lesson opens. Found on qL's Lengtes (2026-08-13): the OLD
   intro hyperbola's y-intercept alone forced the window past MAX_PXU's
   clamp. Every quest that ships an intro must promise a non-null spec for
   every beat, and a spec that actually renders clean markup.
   Negative-tested by hand before trusting it green: temporarily feeding this
   exact check a { spec: null } beat reports FAIL ("spec is null"), and a
   spec whose curve throws inside makeFn() reports FAIL ("threw …") — only
   real, rendering specs pass. */
{
  const g = group("14. Intro cutscenes — every beat's spec renders without throwing");
  let bad = 0, why = "";
  const withIntro = QUESTS.filter((q) => q.intro);
  withIntro.forEach((q) => {
    q.intro.beats.forEach((b, i) => {
      if (!b.spec) { bad++; why = `${q.id} beat ${i}: spec is null`; return; }
      let svg;
      try { svg = renderFunction(b.spec); } catch (e) { bad++; why = `${q.id} beat ${i}: threw ${e.message}`; return; }
      if (BAD.test(String(svg).replace(/class="[^"]*"/g, ""))) { bad++; why = `${q.id} beat ${i}: NaN/undefined in the rendered SVG`; }
    });
  });
  check(g, `every intro beat's spec is non-null and renders cleanly (${withIntro.length} quests carry an intro)`,
    bad === 0 && withIntro.length > 0, why);
}

/* ---------- 15. Quest qL — bug 2 regression guard: both signs ship ----------
   lenVertical/lenToX/lenToY each had a decoy that equalled `correct`
   whenever the target coordinate was already on the "positive" side (or,
   for lenVertical, whenever P sat above Q) — the Set collapsed and the
   generator quietly redrew that whole half of the outcome space away
   (measured: 400/400 shipped rounds landed on the other side). Sampled
   here independently of the fix: both signs of the relevant coordinate
   must occur for each skill, and lenToY must ship both curve kinds
   nicePointOnCurve(true) can draw (line, exp). */
{
  setLang("af");
  const g = group("15. Quest qL — bug 2 regression guard: both signs ship");
  const bySkill = { lenToX: [], lenToY: [], lenVertical: [] };
  let rounds = 0;
  while (rounds < 500 && !Object.values(bySkill).every((a) => a.length >= 60)) {
    buildRound("qL").forEach((it) => { if (bySkill[it.skillId]) bySkill[it.skillId].push(it); });
    rounds++;
  }
  Object.entries(bySkill).forEach(([id, items]) => {
    check(g, `${id} sampled at least 60 rounds (saw ${items.length}, over ${rounds} buildRound calls)`, items.length >= 60);
  });

  const signOf = (it) => {
    const dc = it.debugLen;
    if (it.skillId === "lenToX") return Math.sign(dc.points[0].y);
    if (it.skillId === "lenToY") return Math.sign(dc.points[0].x);
    return Math.sign(dc.points[0].y - dc.points[1].y);          // lenVertical: yF − yG
  };
  let bad = 0, why = "";
  Object.entries(bySkill).forEach(([id, items]) => {
    const signs = new Set(items.map(signOf));
    if (!signs.has(1) || !signs.has(-1)) { bad++; why = `${id}: only saw sign(s) ${[...signs].join(",")}`; }
  });
  check(g, "lenToX / lenToY / lenVertical each ship BOTH signs of the target coordinate", bad === 0, why);

  const kinds = new Set(bySkill.lenToY.map((it) => it.debugLen.kind));
  check(g, `lenToY ships both curve kinds it can draw (line, exp) — saw: ${[...kinds].join(", ")}`,
    kinds.has("line") && kinds.has("exp"));
}

/* ---------- 16. Quest qG — bug 4 regression guard: chord endpoints never coincide ----------
   steeperPair()'s overlap filter used a strict "<", so two chords could
   share an endpoint x and land two dots and two labels on the exact same
   point (measured: 65,5% of rounds did this). Fixed to "<=" (also rejects
   touching ranges); checked here independently by literally comparing the
   four exposed endpoint coordinates. */
{
  setLang("af");
  const g = group("16. Quest qG — bug 4 regression guard: gradSteeper chords never share an endpoint");
  const items = [];
  let rounds = 0;
  while (rounds < 300 && items.length < 60) {

    rounds++;
  }
  check(g, `gradSteeper sampled at least 60 rounds (saw ${items.length})`, items.length >= 60);
  let bad = 0, why = "";
  items.forEach((it) => {
    const pts = it.debugGrad.points;                 // [A, B, C, D]
    const seen = new Set();
    pts.forEach((p) => {
      const k = `${p.x}|${p.y}`;

      seen.add(k);
