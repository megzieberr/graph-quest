}

/* ---------- 17. Quest qG — bug 5 regression guard: m = ±1 can ship ----------
   gradNumber's reciprocal decoy gradientStr(dx,dy) equals the correct
   gradientStr(dy,dx) exactly when |dy| = |dx| (both reduce to ±1), so
   m = +1 and m = −1 could never ship (exhaustively verified: 867/867 such
   draws collapsed and were redrawn away). Sampled here independently: the
   true gradient recomputed via avgGradient() from the exposed raw points,
   never trusting the generator's own dy/dx labels. */
{
  setLang("af");
  const g = group("17. Quest qG — bug 5 regression guard: gradNumber ships m = +1 and m = −1");
  let sawPlus1 = false, sawMinus1 = false, draws = 0;
  while (draws < 300 && !(sawPlus1 && sawMinus1)) {
    buildRound("qG").filter((it) => it.skillId === "gradNumber").forEach((it) => {
      draws++;
      const [A, Bp] = it.debugGrad.points;
      const m = avgGradient(A.y, Bp.y, A.x, Bp.x);
      if (m === 1) sawPlus1 = true;
      if (m === -1) sawMinus1 = true;
    });
  }
  check(g, `gradNumber ships both m = 1 and m = −1 within ${draws} draws (cap 300)`, sawPlus1 && sawMinus1,
    `m=1 seen: ${sawPlus1}, m=−1 seen: ${sawMinus1}`);
}

/* ---------- 18. Quest q6 (Round D) fix-day bug — nicePair() (2026-08-13) ----------
   Two bugs in the same function, both about a whole-number feature landing
   invisibly on an axis or off the gridlines:
     - meets = [r1+p, r2+p] had no guard against 0 — measured 26.5% of
       hyperbola pairs drew a dashed cut line exactly on the y-axis.
     - the hyperbola's OWN x-intercept had no integer guard (unlike the
       shared randHyperbola()) — an odd a with |k| = 2 drew the curve
       crossing the x-axis between gridlines (~9% of rounds).
   Checked independently: the meeting x's are recomputed via funclib's own
   intersections(), never trusted from the generator's own `meets` array,
   and the x-intercept is recomputed via funclib's hypXInt(), never a copy
   of nicePair()'s own arithmetic. Check 10c (above) is the other half of
   this fix's proof — it now also scans the shipped cut lines/band edges. */
{
  setLang("af");
  const g = group("18. Quest q6 — nicePair() bug fix: no meeting point on an axis, hyperbola x-intercept is whole (2026-08-13)");

  const REPS = 400;
  const hyperItems = [];
  for (let rep = 0; rep < REPS && hyperItems.length < 150; rep++) {
    buildRound("q6").filter((it) => it.skillId === "compareSweep" && it.debugCurves && it.debugCurves.f.kind === "hyperbola")
      .forEach((it) => hyperItems.push(it));
  }
  check(g, `sampled at least 150 hyperbola-pair compareSweep rounds (saw ${hyperItems.length}, over ${REPS} buildRound calls)`,
    hyperItems.length >= 150);

  let badMeet = 0, whyMeet = "", meetsChecked = 0;
  let badXi = 0, whyXi = "";
  hyperItems.forEach((it) => {
    const { f, g: gg, win } = it.debugCurves;
    /* independent ground truth: recompute the real meeting x's, never
       trust the generator's own (unstored on debugCurves for this reason) */
    const xs = intersections(f, gg, win.xmin - 5, win.xmax + 5);
    xs.forEach((x) => {
      meetsChecked++;
      if (Math.abs(x) < 1e-9) { badMeet++; whyMeet = `${it.skillId}: a real intersection sits at x = 0`; }
    });
    const xi = hypXInt(f);
    if (xi != null && !Number.isInteger(xi)) { badXi++; whyXi = `${it.skillId}: hyperbola x-intercept ${xi} is not whole (a=${f.a}, p=${f.p}, q=${f.q})`; }
  });
  check(g, `no real intersection (recomputed via intersections(), ${meetsChecked} checked) lands on x = 0`, badMeet === 0, whyMeet);
  check(g, "every sampled hyperbola's own x-intercept (recomputed via hypXInt()) is a whole number", badXi === 0, whyXi);

  /* negative test: prove the two checks above actually catch a bad draw,
     by running their exact logic against a hand-built pair that repeats
     the two historical bugs, then confirming the real sampled rounds are
     clean again once the synthetic pair is removed */
  /* f = 4/(x−2) + 1 and g = x − 1 meet at x = 0 and x = 4 (solved by hand:
     4/(x−2) = x−2 ⇒ (x−2)² = 4 ⇒ x = 0 or 4) — a genuine bad draw, not a
     stand-in, so the check below has something real to catch */
  const badPair = { f: { kind: "hyperbola", a: 4, p: 2, q: 1 }, g: { kind: "line", a: 1, q: -1 } };
  const badWin = { xmin: -8, xmax: 8, ymin: -8, ymax: 8 };
  const badXs = intersections(badPair.f, badPair.g, badWin.xmin, badWin.xmax);
  const causedMeetFail = badXs.some((x) => Math.abs(x) < 1e-9);
  const oddA = { kind: "hyperbola", a: 3, p: 0, q: 2 };       // a/k = 1.5, not whole
  const causedXiFail = !Number.isInteger(hypXInt(oddA));
  check(g, "negative test: a hand-built pair meeting at x = 0 IS caught by the meets-at-zero check",
    causedMeetFail === true, `synthetic meets: ${badXs.map((x) => x.toFixed(3)).join(", ")}`);
  check(g, "negative test: a hand-built odd-a/|k|=2 hyperbola IS caught by the whole-x-intercept check",
    causedXiFail === true, `synthetic hypXInt = ${hypXInt(oddA)}`);
  check(g, "…and the real sampled rounds are still clean (the synthetic cases above were never generated)",
    badMeet === 0 && badXi === 0);
}

/* ---------- 19. Quest qT — reflectionRound never pairs parabola + y-axis (2026-08-13 ruling) ----------
   A parabola reflected over the y-axis (y = f(−x)) is pixel-identical to a
   horizontal shift, so a learner who correctly SEES a slide was marked
   wrong. Megan's ruling: drop the case outright — lines and hyperbolas
   keep both axes, parabolas keep only axis "x". */
{
  setLang("af");
  const g = group("19. Quest qT — reflectionRound never pairs family=\"parabola\" with axis=\"y\" (2026-08-13 ruling)");

  const REPS = 400;
  const items = [];
  let rounds = 0;
  while (rounds < REPS && items.length < 100) {
    buildRound("qT").filter((it) => it.skillId === "reflection").forEach((it) => items.push(it));
    rounds++;
  }
  check(g, `reflection sampled at least 100 rounds (saw ${items.length}, over ${rounds} buildRound calls)`, items.length >= 100);

  const findsBadParabolaY = (list) => list.some((it) => {
    const dc = it.debugTransform;
    return dc && dc.kind === "reflection" && dc.family === "parabola" && dc.axis === "y";
  });

  check(g, `no sampled reflection round pairs family="parabola" with axis="y" (${items.length} rounds checked)`,
    !findsBadParabolaY(items));
  /* both axes still turn up for the families that keep them */
  const axesByFamily = {};
  items.forEach((it) => {
    const dc = it.debugTransform;
    if (!dc) return;
    (axesByFamily[dc.family] ||= new Set()).add(dc.axis);
  });
  check(g, `lines and hyperbolas keep BOTH reflection axes (saw: ${Object.entries(axesByFamily).map(([f, s]) => `${f}=${[...s].join("/")}`).join(", ")})`,
    ["line", "hyperbola"].every((f) => axesByFamily[f] && axesByFamily[f].has("x") && axesByFamily[f].has("y")));
  check(g, `parabola reflection rounds keep ONLY axis "x"`,
    !axesByFamily.parabola || (axesByFamily.parabola.has("x") && !axesByFamily.parabola.has("y")));

  /* negative test, exactly as briefed: make the check fail on a synthetic
     parabola/y case once, then restore it and confirm clean again */
  const synthetic = [...items, { skillId: "reflection", debugTransform: { kind: "reflection", family: "parabola", axis: "y" } }];
  check(g, "negative test: injecting one synthetic parabola+y case IS caught",
    findsBadParabolaY(synthetic) === true);
  check(g, "…and the real sampled rounds report clean again once the synthetic case is removed (restored)",
    findsBadParabolaY(items) === false);
}

/* ---------- 20. randHyperbola() fix — no hyperbola drawn by it sits on an axis (2026-08-13 ruling) ----------
   MEGAN'S RULING: stop allowing p = 0 (and q = 0) globally in randHyperbola()
   itself, so EVERY quest, batch 1 included, draws hyperbolas with both
   asymptotes off the axes — not just the batch-2 quests that already went
   through randHyperbolaOffAxis(). Checked on real generated curves pulled
   out of the shipped rounds of the batch-1 quests that actually CALL
   randHyperbola() — q2 (Op die grafiek), q3 (Lees die gebied), q5 (positive/
   negative) — never a source-file regex. q7 (Eksamenmodus) is deliberately
   excluded: its exam sheets are fixed, hand-authored content (RUN-PLAN's
   "three fixed batch-1 sheets", see js/quests/index.js), not draws from
   randHyperbola(), and q7-exam.js is out of this fix's scope. */
{
  setLang("af");
  const g = group("20. randHyperbola() fix: no hyperbola it draws has an asymptote on an axis (2026-08-13 ruling)");

  /* the fix itself: call the ONE shared generator every batch-1 quest
     draws from, directly, and assert on what it hands back — never a copy
     of its logic, never a source regex */
  let bad = 0, why = "", genChecked = 0;
  for (let i = 0; i < 300; i++) {
    const cv = randHyperbola();
    genChecked++;
    if (asymOnAxis(cv)) { bad++; why = `randHyperbola() returned a=${cv.a} p=${cv.p} q=${cv.q} — on an axis`; }
  }
  check(g, `randHyperbola() called directly (${genChecked} times) never returns p = 0 or q = 0`, bad === 0, why);

  /* it reaches the batch-1 quests: q2 (Op die grafiek), q3 (Lees die
     gebied), q5 (positive/negative) are the three that actually call
     randHyperbola() (q7's exam sheets are fixed hand-authored content —
     not draws from it, and q7-exam.js is out of this fix's scope). Every
     hyperbola curve their SHIPPED rounds expose (it.graph for a plain mc
     round, it.then.graph for an interactive round's follow-up) is checked
     — the ones drawn only inside an interactive build() closure aren't
     reachable without touching those files, so this is a real spot-check
     of the integration, not a full census. */
  const CALLERS = ["q2", "q3", "q5"];
  const hyperbolasOf = (it) => {
    const out = [];
    [it.graph, it.then && it.then.graph].filter(Boolean).forEach((sp) => (sp.curves || []).forEach((cv) => out.push(cv)));
    return out.filter((cv) => cv && cv.kind === "hyperbola");
  };
  let roundsSeen = 0, hyperCount = 0, bad2 = 0, why2 = "";
  for (let rep = 0; rep < 60; rep++) {
    for (const qid of CALLERS) {
      let items = [];
      try { items = buildRound(qid); } catch { continue; }
      roundsSeen += items.length;
      items.forEach((it) => {
        hyperbolasOf(it).forEach((cv) => {
          hyperCount++;
          if (asymOnAxis(cv)) { bad2++; why2 = `${qid}/${it.skillId}: hyperbola a=${cv.a} p=${cv.p} q=${cv.q} sits on an axis`; }
        });
      });
    }
  }
  check(g, `at least 200 rounds sampled across q2/q3/q5 (saw ${roundsSeen})`, roundsSeen >= 200);
  check(g, `the fix reaches q2/q3/q5: ${hyperCount} exposed hyperbola curves seen among them, none on an axis`,
    hyperCount > 0 && bad2 === 0, why2);
}

/* ---------- 21. js/screens.js fix — quest unlock is grandfathered (2026-08-13 ruling) ----------
   Unlocking used to be pure array order — inserting batch 2's three new
   quests re-locked Eksamenmodus for existing profiles, and the q2/q3 order
   swap could show a done-but-ticked card with a padlock. Now: a quest is
   open if the PREVIOUS quest is done, OR the quest itself was ever played
   or finished (plays > 0 || done) — nobody's visible progress is ever
   taken away. Checked through questUnlocked(), the one exported rule
   (same pattern as secondChanceAllowed() in play.js), AND against the real
   map screen's DOM so a future edit to mapScreen() can't quietly stop
   calling it. */
{
  const g = group("21. js/screens.js fix — quest unlock is grandfathered, never re-locked by array order (2026-08-13 ruling)");
  const ids = QUESTS.map((q) => q.id);

  /* (a) every batch-1 id done (qL/qG/qT never played — exactly what an
     existing profile looked like the moment batch 2 shipped) → Eksamenmodus
     (q7) stays unlocked, even though the quest immediately before it in
     the array (qT) was never touched. */
  const batch1Ids = ids.filter((id) => !["qL", "qG", "qT"].includes(id));
  const profileA = { quests: {} };
  batch1Ids.forEach((id) => { profileA.quests[id] = { done: true, best: 5, total: 5, plays: 3 }; });
  const iq7 = ids.indexOf("q7");
  check(g, `(a) all ${batch1Ids.length} batch-1 quest ids done, qL/qG/qT never played → Eksamenmodus (q7) is unlocked`,
    questUnlocked(profileA, iq7) === true, `batch1Ids: ${batch1Ids.join(", ")}`);

  /* (b) q3 done, q2 not → q3's own card stays unlocked and not disabled,
     checked both through questUnlocked() and on the real rendered map */
  const profileB = { quests: { q3: { done: true, best: 4, total: 5, plays: 2 } } };
  const iq3 = ids.indexOf("q3");
  check(g, "(b) q3 done, q2 not done → q3 stays unlocked (grandfathered on its own progress)",
    questUnlocked(profileB, iq3) === true);
  const cardsB = [...mapScreen(profileB, () => {}, () => {}).querySelectorAll(".qcard")];
  const cardB = cardsB[iq3];
  check(g, "(b) on the real map screen, q3's card is enabled and shows no padlock",
    !!cardB && cardB.disabled === false && !cardB.innerHTML.includes("🔒"));

  /* (c) an empty profile → only the first quest is unlocked */
  const profileC = { quests: {} };
  let bad = 0, why = "";
  ids.forEach((id, i) => {
    const want = i === 0;
    if (questUnlocked(profileC, i) !== want) { bad++; why = `${id} (index ${i}): expected unlocked=${want}, got ${questUnlocked(profileC, i)}`; }
  });
  check(g, "(c) an empty profile unlocks only the first quest, via questUnlocked()", bad === 0, why);
  const cardsC = [...mapScreen(profileC, () => {}, () => {}).querySelectorAll(".qcard")];
  check(g, "(c) on the real map screen, only the first card is enabled and every other one shows a padlock",
    cardsC.length === ids.length && cardsC.every((c, i) => (i === 0) === (c.disabled === false) && (i === 0) === !c.innerHTML.includes("🔒")));
}

/* ---------- 22. Off-axis asymptote rule — every quest, walked on the real built specs (fix day, 2026-08-13) ----------
   Check 10d's regex is a belt: it only greps the SOURCE TEXT of three
   hard-coded batch-2 files for "randHyperbola(" calls, so it says nothing
   about a curve built by hand (a future quest, or q7's exam sheets) and
   nothing about whether a caught call actually PRODUCES an on-axis curve.
   This is the real check: walk the actual built specs every quest hands
   back (it.graph on a plain or now-exposed interactive item, it.then.graph
   on an interactive item's mc follow-up) and assert asymOnAxis() is false
   for every hyperbola curve really drawn — never a copy of any
   generator's own logic, never a source regex.
   Exclusion: q7's three exam sheets are fixed, hand-authored content
   (RUN-PLAN's own spec; js/quests/q7-exam.js is out of this fix's scope).
   sheetHypLine hard-codes p: 0 by design, so its hyperbola sits on the
   y-axis on purpose — skipped here and reported, never counted as a
   failure. */
{
  setLang("af");
  const g = group("22. Off-axis asymptote rule — every quest, on the real built specs (fix day)");
  let bad = 0, why = "", checked = 0, q7Skipped = 0;
  for (const q of QUESTS) {
    for (let rep = 0; rep < 10; rep++) {
      let items = [];
      try { items = buildRound(q.id); } catch { continue; }
      items.forEach((it) => {
        const specs = [it.graph, it.then && it.then.graph].filter(Boolean);
        specs.forEach((sp) => {
          (sp.curves || []).forEach((cv) => {
            if (!cv || cv.kind !== "hyperbola") return;
            checked++;
            if (!asymOnAxis(cv)) return;
            if (q.id === "q7") { q7Skipped++; return; }
            bad++; why = `${q.id}/${it.skillId || "?"}: hyperbola a=${cv.a} p=${cv.p} q=${cv.q} sits on an axis`;
          });
        });
      });
    }
  }
  check(g, `every hyperbola reachable via it.graph/it.then.graph, across every quest, has both asymptotes off-axis (${checked} hyperbola curves checked, q7 excluded)`,
    bad === 0 && checked > 0, why);
  if (q7Skipped) {
    info(g, `q7 (Eksamenmodus) hand-authored sheetHypLine draws p = 0 by design — ${q7Skipped} on-axis hyperbola(s) skipped, not failed (RUN-PLAN's fixed sheets; q7-exam.js is out of this fix's scope)`);
  }

  /* negative test: prove this exact walk catches a bad curve, on a
     hand-built item shaped like a real one but with an on-axis hyperbola
     exposed as it.graph — then confirm the same walk clears an otherwise
     identical off-axis curve, so the scan isn't just always failing */
  const scanOne = (it) => {
    const specs = [it.graph, it.then && it.then.graph].filter(Boolean);
    let caught = false;
    specs.forEach((sp) => (sp.curves || []).forEach((cv) => {
      if (cv && cv.kind === "hyperbola" && asymOnAxis(cv)) caught = true;
    }));
    return caught;
  };
  const badItem = { skillId: "synthetic", graph: { curves: [{ kind: "hyperbola", a: 4, p: 0, q: 1 }] } };
  const cleanItem = { skillId: "synthetic", graph: { curves: [{ kind: "hyperbola", a: 4, p: 1, q: 1 }] } };
  check(g, "negative test: a hand-built item exposing an on-axis hyperbola via it.graph IS caught by this scan", scanOne(badItem) === true);
  check(g, "…and an off-axis hyperbola in the same shape is NOT flagged (the scan isn't just always failing)", scanOne(cleanItem) === false);
}

/* ---------- 23. Quest 5 rebuild — her board method: cut lines, mark the
   curve, read off (fix day, 2026-08-13). She dropped the TEKENTABEL on
   2026-08-09 after her learners struggled with it; her ruling today
   authorises the rebuild. Every check below replaces an old tekentabel-
   asserting check with an equal-or-stronger one on the new flow — the
   ONE sanctioned replacement, nothing else relaxed. ---------- */
{
  setLang("af");
  const g = group("23. Quest 5 rebuild — cut lines, mark the curve, read off (replaces the TEKENTABEL, 2026-08-13 ruling)");
  const host = document.createElement("div");
  host.style.position = "absolute"; host.style.left = "-9999px"; host.style.width = "360px";
  document.body.appendChild(host);

  const SKILL_IDS = ["singleSign", "productSign"];
  const REPS = 20;
  const gathered = { singleSign: [], productSign: [] };
  for (let rep = 0; rep < REPS; rep++) {
    buildRound("q5").forEach((it) => { if (SKILL_IDS.includes(it.skillId)) gathered[it.skillId].push(it); });
  }
  SKILL_IDS.forEach((id) => check(g, `${id} builds across ${REPS} rounds`, gathered[id].length > 0, `saw ${gathered[id].length}`));

  const curvesOf = (id, dc) => (id === "singleSign" ? [dc.cv] : [dc.a, dc.b]);
  const idxOf = (id) => (id === "singleSign" ? [0] : [0, 1]);

  /* the exact predicate signPaint uses to decide a section gets a slot
     for a given curve — recomputed independently so the test can predict
     which rect.iv-hit belongs to which (curve, section) pair */
  function paintNodes(curveIdx, secs, curvesArr, win) {
    const out = [];
    curveIdx.forEach((ci) => {
      const f = mf(curvesArr[ci]);
      secs.forEach((s, si) => {
        const y = f(s.mid);
        if (!Number.isFinite(y) || y < win.ymin || y > win.ymax) return;
        out.push({ ci, si, y });
      });
    });
    return out;
  }

  /* 23-paint. NEVER RELAX — every painted curve must own at least one
     paint box. A curve with zero in-frame section midpoints gets zero
     slots; if every curve is empty, signPaint's construction-time
     onChange reports allMarked vacuously and the paint phase used to
     crash in the TDZ before rendering (2,2% of singleSign draws, always
     a steep line — foreman review find, 2026-08-14; generators now
     reject those draws via paintable()). */
  {
    let bad = 0, why = "", curvesChecked = 0;
    for (const id of SKILL_IDS) {
      for (const it of gathered[id]) {
        const dc = it.debugCurves;
        const curvesArr = curvesOf(id, dc);
        idxOf(id).forEach((ci) => {
          curvesChecked++;
          if (!paintNodes([ci], dc.secs, curvesArr, dc.win).length) {
            bad++; why = `${id}: curve ${ci} has ZERO paint boxes (every section midpoint off-frame)`;
          }
        });
      }
    }
    check(g, `every painted curve owns at least one paint box — no round the paint phase cannot mount (${curvesChecked} curves checked)`, bad === 0, why);
  }

  /* mount the round, place every REQUIRED cut-line socket (skip decoys),
     wait for the paint phase to mount */
  async function mountAndCut(it) {
    const box = document.createElement("div");
    host.appendChild(box);
    let doneCalled = false;
    it.build(box, () => { doneCalled = true; }, () => {}, () => {}, () => {});
    const dc = it.debugCurves;
    const hits = [...box.querySelectorAll("rect.iv-hit")];
    dc.cands.forEach((c, i) => { if (c.need) hits[i].dispatchEvent(new PointerEvent("pointerdown", { bubbles: true, cancelable: true })); });
    await new Promise((r) => setTimeout(r, 420));
    return { box, dc, isDone: () => doneCalled };
  }

  /* 23a. the cut-line candidates sit EXACTLY at a fresh criticalXs()
     recompute — never rounded, never approximated */
  let bad = 0, why = "", cutsChecked = 0;
  for (const id of SKILL_IDS) {
    for (const it of gathered[id].slice(0, 12)) {
      const dc = it.debugCurves;
      const fresh = criticalXs(curvesOf(id, dc), dc.win.xmin, dc.win.xmax).sort((p, q2) => p.x - q2.x);
      const want = [...dc.cuts].sort((p, q2) => p.x - q2.x);
      if (fresh.length !== want.length) { bad++; why = `${id}: fresh criticalXs gave ${fresh.length}, round exposed ${want.length}`; continue; }
      fresh.forEach((c, i) => {
        cutsChecked++;
        if (Math.abs(c.x - want[i].x) > 1e-6) { bad++; why = `${id}: cut ${i} exposed x=${want[i].x} vs fresh recompute x=${c.x}`; }
      });
    }
  }
  check(g, `the cut-line candidates sit exactly at a fresh criticalXs() recompute (${cutsChecked} cuts checked)`, bad === 0, why);
  {
    const it = gathered.singleSign[0];
    if (it) {
      const dc = it.debugCurves;
      const tampered = dc.cuts.map((c) => ({ ...c, x: c.x + 0.5 }));
      const matches = tampered.length === dc.cuts.length && tampered.every((c, i) => Math.abs(c.x - dc.cuts[i].x) <= 1e-6);
      check(g, "negative test: the exact-match cut comparison above correctly rejects a tampered (shifted) cut set", matches === false);
    }
  }

  /* 23b. no section's midpoint sits ON a cut line — no round can ever ask
     about a sign AT a boundary */
  bad = 0; why = ""; let midChecked = 0;
  for (const id of SKILL_IDS) {
    for (const it of gathered[id]) {
      const dc = it.debugCurves;
      dc.secs.forEach((s) => {
        midChecked++;
        dc.cuts.forEach((c) => { if (Math.abs(s.mid - c.x) < 1e-6) { bad++; why = `${id}: a section mid sits exactly on a cut line`; } });
      });
    }
  }
  check(g, `no section's midpoint sits on a cut line, across every round (${midChecked} sections checked)`, bad === 0, why);
  {
    const cuts3 = [{ x: -1 }, { x: 3 }];
    const onCut = (mid) => cuts3.some((c) => Math.abs(mid - c.x) < 1e-6);
    check(g, "negative test: the mid-on-a-cut predicate above catches a section deliberately sitting on a cut", onCut(-1) === true);
    check(g, "…and does not flag an ordinary midpoint (the predicate is not just always passing)", onCut(1) === false);
  }

  /* 23c. the paint phase numbers every section (①②③…) — the interactive.js
     extension added for this rebuild */
  {
    const it = gathered.singleSign[0];
    if (it) {
      const { box, dc } = await mountAndCut(it);
      const labels = [...box.querySelectorAll("text.iv-sectlab")];
      check(g, `the paint phase numbers every section (${labels.length} labels drawn, wanted ${dc.secs.length})`, labels.length === dc.secs.length);
    }
  }

  /* 23d. marking the TRUE sign at every section (independent of the
     round's own truth object — recomputed raw from the exposed curve)
     reveals every mark correct */
  bad = 0; why = ""; let paintChecked = 0;
  for (const id of SKILL_IDS) {
    for (const it of gathered[id].slice(0, 8)) {
      const { box, dc } = await mountAndCut(it);
      const nodes = paintNodes(idxOf(id), dc.secs, curvesOf(id, dc), dc.win);
      const hits = [...box.querySelectorAll("rect.iv-hit")];
      if (hits.length !== nodes.length) { bad++; why = `${id}: ${hits.length} paint targets, wanted ${nodes.length}`; continue; }
      nodes.forEach((n, i) => {
        const taps = n.y > 0 ? 1 : 2;              // blank→+ (true +) or blank→+→− (true −)
        for (let t = 0; t < taps; t++) hits[i].dispatchEvent(new PointerEvent("pointerdown", { bubbles: true, cancelable: true }));
      });
      paintChecked += nodes.length;
      const slots = [...box.querySelectorAll("rect.iv-signslot")];
      if (slots.length !== nodes.length) { bad++; why = `${id}: slot count mismatch after marking`; continue; }
      slots.forEach((s) => { if (s.style.stroke !== "var(--good)") { bad++; why = `${id}: a mark matching the true sign was revealed WRONG (stroke=${s.style.stroke})`; } });
    }
  }
  check(g, `marking the TRUE sign at every section reveals every mark correct, recomputed raw from the exposed curve (${paintChecked} marks)`, bad === 0, why);

  /* negative test for 23d: marking every section with the WRONG sign
     must be revealed wrong, never silently accepted */
  bad = 0; why = ""; let negChecked = 0;
  for (const id of SKILL_IDS) {
    const it = gathered[id][gathered[id].length - 1];
    if (!it) continue;
    const { box, dc } = await mountAndCut(it);
    const nodes = paintNodes(idxOf(id), dc.secs, curvesOf(id, dc), dc.win);
    const hits = [...box.querySelectorAll("rect.iv-hit")];
    nodes.forEach((n, i) => {
      const taps = n.y > 0 ? 2 : 1;                // deliberately the WRONG sign every time
      for (let t = 0; t < taps; t++) hits[i].dispatchEvent(new PointerEvent("pointerdown", { bubbles: true, cancelable: true }));
    });
    negChecked += nodes.length;
    const slots = [...box.querySelectorAll("rect.iv-signslot")];
    if (slots.some((s) => s.style.stroke === "var(--good)")) { bad++; why = `${id}: a deliberately-wrong mark was revealed as correct`; }
  }
  check(g, `negative test: marking every section with the WRONG sign is revealed wrong, not silently accepted (${negChecked} marks)`, bad === 0, why);

  /* 23e. the painting SURVIVES into the read-off even when it is wrong —
     house law (batch 1 / q6): the app never blocks progress on a wrong
     mark, a wrong painting reads into a wrong answer and the feedback
     panel (misc) catches it there, not a locked stage */
  bad = 0; why = "";
  for (const id of SKILL_IDS) {
    const it = gathered[id][1] || gathered[id][0];
    if (!it) continue;
    const box2 = document.createElement("div");
    host.appendChild(box2);
    let doneCalled = false;
    it.build(box2, () => { doneCalled = true; }, () => {}, () => {}, () => {});
    const dc = it.debugCurves;
    const hits0 = [...box2.querySelectorAll("rect.iv-hit")];
    dc.cands.forEach((c, i) => { if (c.need) hits0[i].dispatchEvent(new PointerEvent("pointerdown", { bubbles: true, cancelable: true })); });
    await new Promise((r) => setTimeout(r, 420));
    const nodes = paintNodes(idxOf(id), dc.secs, curvesOf(id, dc), dc.win);
    const hits = [...box2.querySelectorAll("rect.iv-hit")];
    nodes.forEach((n, i) => hits[i].dispatchEvent(new PointerEvent("pointerdown", { bubbles: true, cancelable: true }))); // one tap each = "+" everywhere, wrong on some sections by construction
    await new Promise((r) => setTimeout(r, 500));
    if (!doneCalled) { bad++; why = `${id}: an all-"+" painting (wrong on some sections) never unlocked the read-off — progress is blocked on a wrong mark`; continue; }
    if (!it.then || !it.then.answerLabel) { bad++; why = `${id}: no follow-up question after the paint phase`; }
  }
  check(g, "the read-off unlocks even when the painting is wrong on some sections — mistakes carry into the mc(), never blocking progress (house law)", bad === 0, why);

  /* 23f. the correct answer matches funclib's sign analysis, recomputed
     independently via signAt/sections — never the round's own chosen/
     correct fields */
  bad = 0; why = ""; let recomputed = 0;
  gathered.singleSign.forEach((it) => {
    const dc = it.debugCurves;
    const secs2 = sections(dc.cuts, dc.win.xmin, dc.win.xmax);
    const wantSign = dc.wantPos ? 1 : -1;
    const chosen2 = secs2.filter((s) => signAt(dc.cv, s.mid) === wantSign);
    const expected = strip(answerString(chosen2, dc.cuts, dc.win, { strict: true, lang: "af" }));
    const got = strip(L(it.then.answerLabel || ""));
    recomputed++;
    if (expected !== got) { bad++; why = `singleSign: expected "${expected}" got "${got}"`; }
  });
  gathered.productSign.forEach((it) => {
    const dc = it.debugCurves;
    const secs2 = sections(dc.cuts, dc.win.xmin, dc.win.xmax);
    const chosen2 = secs2.filter((s) => {
      const p = signAt(dc.a, s.mid) * signAt(dc.b, s.mid);
      return dc.wantNeg ? p < 0 : p > 0;
    });
    const expected = strip(answerString(chosen2, dc.cuts, dc.win, { strict: dc.strict, lang: "af" }));
    const got = strip(L(it.then.answerLabel || ""));
    recomputed++;
    if (expected !== got) { bad++; why = `productSign: expected "${expected}" got "${got}"`; }
  });
  check(g, `the correct answer matches funclib's sign analysis, recomputed independently via signAt/sections (${recomputed} rounds)`, bad === 0, why);
  {
    const it = gathered.singleSign[0];
    if (it) {
      const dc = it.debugCurves;
      const secs2 = sections(dc.cuts, dc.win.xmin, dc.win.xmax);
      const flipped = secs2.filter((s) => signAt(dc.cv, s.mid) === (dc.wantPos ? -1 : 1));   // deliberately the OPPOSITE sign
      const flippedStr = strip(answerString(flipped, dc.cuts, dc.win, { strict: true, lang: "af" }));
      const got = strip(L(it.then.answerLabel || ""));
      check(g, "negative test: recomputing with the OPPOSITE wanted sign gives a different string than the round's real answer (23f's comparison is not vacuously equal)", flippedStr !== got);
    }
  }

  /* 23g. 4 distinct options ship consistently */
  {
    let n4 = 0, total = 0;
    [...gathered.singleSign, ...gathered.productSign].forEach((it) => { total++; if (it.then.options.length === 4) n4++; });
    check(g, `singleSign/productSign consistently ship 4 distinct options (${n4}/${total})`, total > 0 && n4 === total, `${n4}/${total}`);
  }

  /* 23h. regression guard — the retired tekentabel is really gone: no
     round reports the old kind, and no <table class="sign-table"> ever
     renders from the new build() */
  bad = 0; why = "";
  [...gathered.singleSign, ...gathered.productSign].forEach((it) => { if (it.kind !== "signPaint") { bad++; why = `an item reports kind:"${it.kind}", wanted "signPaint"`; } });
  {
    const probeBox = document.createElement("div");
    host.appendChild(probeBox);
    const probeIt = gathered.singleSign[0] || gathered.productSign[0];
    if (probeIt) {
      probeIt.build(probeBox, () => {}, () => {}, () => {}, () => {});
      if (probeBox.querySelector("table.sign-table")) { bad++; why = "a <table class=\"sign-table\"> still renders — the tekentabel is supposed to be gone"; }
    }
  }
  check(g, "every quest 5 round reports kind:\"signPaint\" (never the retired \"signTable\"), and no <table class=\"sign-table\"> renders from the new flow", bad === 0, why);

  host.remove();
}

/* ---------- 24. Quest qE (Vind die vergelyking) — batch 3, session 1 ---------- */
{
  setLang("af");
  const g = group("24. Quest qE (Vind die vergelyking) — batch 3, session 1");
  const host = document.createElement("div");
  host.style.position = "absolute"; host.style.left = "-9999px"; host.style.width = "360px";
  document.body.appendChild(host);

  const REPS = 30;
  const rounds = [];
  for (let i = 0; i < REPS; i++) rounds.push(...buildRound("qE"));
  check(g, `qE builds rounds across ${REPS} reps`, rounds.length > 0, `saw ${rounds.length}`);

  const r1 = rounds.filter((it) => it.skillId === "chooseForm");
  const r2 = rounds.filter((it) => it.skillId === "tapValues");
  const r3 = rounds.filter((it) => it.skillId === "whichEquation");
  check(g, `all three round types appear across ${REPS} reps (R1 ${r1.length}, R2 ${r2.length}, R3 ${r3.length})`,
    r1.length > 0 && r2.length > 0 && r3.length > 0);

  /* R2: every filled slot value equals a FRESH funclib recompute for the
     drawn curve — never the round's own stored value trusted blindly */
  let bad = 0, why = "", slotsChecked = 0;
  r2.forEach((it) => {
    const dc = it.debugFormFill;
    if (!dc) { bad++; why = "an R2 round exposes no debugFormFill"; return; }
    let want = {};
    if (dc.mode === "hakie") { const tp = paraTP(dc.cv); want = { p: tp.x, q: tp.y }; }
    else if (dc.mode === "intercept") { const [x1, x2] = paraRoots(dc.cv); want = { x1, x2 }; }
    else if (dc.mode === "hyperbola") want = { p: dc.cv.p, q: dc.cv.q };
    else if (dc.mode === "exp") want = { q: dc.cv.q };
    dc.slots.forEach((s) => {
      slotsChecked++;
      if (Math.abs(s.value - want[s.id]) > 1e-9) { bad++; why = `${dc.mode}: slot ${s.id} exposed ${s.value}, fresh recompute ${want[s.id]}`; }
    });
  });
  check(g, `every R2 slot value equals a fresh funclib recompute for its drawn curve (${slotsChecked} slots checked)`, bad === 0 && slotsChecked > 0, why);

  /* R3: the correct option re-renders to the drawn curve everywhere sampled;
     no decoy does anywhere sampled — render-and-compare BY VALUE, the qT
     pattern, never a text/label comparison */
  bad = 0; why = ""; let r3Checked = 0, decoysChecked = 0;
  r3.forEach((it) => {
    const dc = it.debugEquation;
    if (!dc) { bad++; why = "an R3 round exposes no debugEquation"; return; }
    r3Checked++;
    const { xmin, xmax } = dc.win;
    const sameEverywhere = (cvA, cvB) => {
      const fA = mf(cvA), fB = mf(cvB);
      for (let i = 0; i <= 40; i++) {
        const x = xmin + (i / 40) * (xmax - xmin);
        if (cvA.kind === "hyperbola" && Math.abs(x - cvA.p) < 0.3) continue;
        const ya = fA(x), yb = fB(x);
        if (!Number.isFinite(ya) || !Number.isFinite(yb)) continue;
        if (Math.abs(ya - yb) > 1e-6) return false;
      }
      return true;
    };
    if (!sameEverywhere(dc.drawnCv, dc.correctCv)) { bad++; why = `${dc.family}: the CORRECT option does not re-render to the drawn curve`; }
    dc.decoyCvs.forEach((decoy, di) => {
      decoysChecked++;
      if (sameEverywhere(dc.drawnCv, decoy)) { bad++; why = `${dc.family}: decoy ${di} matches the drawn curve everywhere sampled — a real value collision`; }
    });
  });
  check(g, `R3's correct equation re-renders to the drawn curve, and no decoy does (${r3Checked} rounds, ${decoysChecked} decoys, render-and-compare by value)`, bad === 0, why);

  /* formFill mounts every tap target and stays locked until every slot is
     filled: tapping only decoys never unlocks it; tapping every required
     feature, in slot order, always does */
  bad = 0; why = ""; let mountedChecked = 0;
  for (const it of r2.slice(0, 12)) {
    const dc = it.debugFormFill;
    const box = document.createElement("div");
    host.appendChild(box);
    let doneCalled = false;
    it.build(box, () => { doneCalled = true; }, () => {});
    const hits = [...box.querySelectorAll("circle.iv-hit")];
    if (hits.length !== dc.tapIds.length) { bad++; why = `${dc.mode}: ${hits.length} tap targets mounted, wanted ${dc.tapIds.length}`; continue; }
    mountedChecked++;
    const requiredTapIds = new Set(dc.slots.map((s) => s.tapId));
    dc.tapIds.forEach((id, i) => { if (!requiredTapIds.has(id)) hits[i].dispatchEvent(new PointerEvent("pointerdown", { bubbles: true, cancelable: true })); });
    if (doneCalled) { bad++; why = `${dc.mode}: tapping only the decoy feature(s) unlocked the form`; continue; }
    const orderedTapIds = [];
    dc.slots.forEach((s) => { if (!orderedTapIds.includes(s.tapId)) orderedTapIds.push(s.tapId); });
    orderedTapIds.forEach((tid) => {
      const idx = dc.tapIds.indexOf(tid);
      hits[idx].dispatchEvent(new PointerEvent("pointerdown", { bubbles: true, cancelable: true }));
    });
    if (!doneCalled) { bad++; why = `${dc.mode}: tapping every required feature, in order, never unlocked the form`; }
  }
  check(g, `formFill mounts every tap target and stays locked until every slot is filled (${mountedChecked} rounds mounted)`, bad === 0 && mountedChecked > 0, why);

  host.remove();
}

document.getElementById("sum").innerHTML = fail === 0
  ? `<span class="ok">ALL ${pass} CHECKS PASS</span>`
  : `<span class="no">${fail} FAILED</span> · ${pass} passed`;
window.__verify = { pass, fail };
</script>
</body>
</html>
